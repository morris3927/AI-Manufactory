<section id="lockout" data-transition="fade" style="background:#F3F1EB;color:#1B2433;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px;display:grid;grid-template-columns:1fr 600px;gap:64px;align-items:center">
<div style="display:flex;flex-direction:column;gap:32px">
<h2 style="font-size:60px;font-weight:700;line-height:1.2">上鎖前也能問，<br>但碰機台的步驟會被標出來</h2>
<div style="background:#FBFAF7;border-left:6px solid #2F6BD8;border-radius:12px;padding:28px">
<p style="font-size:28px;line-height:1.5"><b>只看不碰的步驟</b>：讀警報碼、看數據趨勢、看攝影機畫面，由程式直接判定不需要把關。</p>
</div>
<div style="background:#FBFAF7;border-left:6px solid #C26A1B;border-radius:12px;padding:28px">
<p style="font-size:28px;line-height:1.5"><b>要碰機台的步驟</b>：伸手、開護罩、拆零件，在上鎖完成前標成「需先完成上鎖掛牌」。</p>
</div>
<p style="font-size:26px;line-height:1.5;color:#4A5568">不把資訊整段鎖住，是因為那樣會逼人為了看步驟先把清單亂勾完，紀錄就不可信了。</p>
</div>
