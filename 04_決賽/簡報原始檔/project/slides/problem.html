<section id="problem" data-transition="fade" style="background:#F3F1EB;color:#1B2433;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:56px">
<h2 style="font-size:64px;font-weight:700">製造現場的異常，警報之後才是問題</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:28px">
<div style="background:#FBFAF7;border:1px solid #DAD6CC;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:16px">
<h3 style="font-size:40px;font-weight:700;color:#2F6BD8">找人慢</h3>
<p style="font-size:28px;line-height:1.5;color:#4A5568">影像、機台數據、班表分在不同系統，要靠人確認再打電話找人</p>
</div>
<div style="background:#FBFAF7;border:1px solid #DAD6CC;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:16px">
<h3 style="font-size:40px;font-weight:700;color:#2F6BD8">修得慢</h3>
<p style="font-size:28px;line-height:1.5;color:#4A5568">判斷原因靠老師傅經驗，新人要試好幾輪</p>
</div>
<div style="background:#FBFAF7;border:1px solid #DAD6CC;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:16px">
<h3 style="font-size:40px;font-weight:700;color:#C93C3C">修的時候受傷</h3>
<p style="font-size:28px;line-height:1.5;color:#4A5568">沒確實停機、上鎖就排除故障，容易夾傷、捲入</p>
</div>
<div style="background:#FBFAF7;border:1px solid #DAD6CC;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:16px">
<h3 style="font-size:40px;font-weight:700;color:#2F6BD8">經驗帶不走</h3>
<p style="font-size:28px;line-height:1.5;color:#4A5568">經驗留在個人腦中，換人或新廠上線就斷掉</p>
</div>
</div>
<p style="font-size:32px;line-height:1.5;color:#1B2433">機台本身多半會跳警報，所以我們要幫的不是「更早發現」，<b>是發現之後的事：找對人、帶著線索、安全地修好</b>。</p>
<aside>（約 50 秒）先講清楚定位，避免評審問「機台本來就有警報，你們多做什麼」。四個痛點各一句，重點放在最後一句。可以順帶一句：勤誠正在擴建海外新廠，經驗帶不走的問題會更明顯。</aside>
</section>
