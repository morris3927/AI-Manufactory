<h2 style="font-size:56px;font-weight:700;line-height:1.3">鐵板卡在模具入口。<br>技術員想：「伸手拿出來就好了吧？」</h2>
<div style="background:#101B2C;border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:16px">
<p style="font-size:26px;color:#8FB3F0">技術員到場後問維修助理，幾秒後收到回覆</p>
<p style="font-size:36px;line-height:1.5;color:#F3F1EB"><b>不行，不要直接伸手。</b>先確認上鎖掛牌完成、請主管到場，再用長柄夾具把料片取出。</p>

<aside>（約 45 秒）講故事，不要唸投影片。卡料一發生，攝影機加機台數據約 0.5 秒就確認是真的卡料，直接通知當班的小林，通知裡附上最可能的三個原因和 SOP，這時現場還沒人發現送料機停了。小林到場後問助理能不能直接伸手，助理說不行：先上鎖掛牌、請主管到場、用工具取出。最後復機由當初上鎖的人自己做，AI 不會說可以開機。右邊的圖給沒看過沖床的評審看卡料在哪裡。</aside>
