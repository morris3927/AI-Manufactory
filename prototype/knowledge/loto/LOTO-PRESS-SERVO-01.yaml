# 伺服沖床上鎖掛牌（LOTO）檢查表 —— 07_RAG知識庫資料.md §4.4
# data_label: 模擬資料。隔離點代號（QS1、V1…）、壓力與電壓門檻皆為模擬值，非任何原廠規格。
# 本檔不切塊、不進向量庫；kb.loto_for(machine_type) 直接讀取，固定附在維修代理回答最前面。
# review_status: approved（AI 角色扮演審核（模擬資深維修課長），非真人專家審核）；審核紀錄見 reviews/2026-10-21_press_chief.md
loto_id: LOTO-PRESS-SERVO-01
version: "0.2"
title: 伺服沖床（250 t 級）停機、隔離與上鎖掛牌程序
machine_type: servo_press
applies_to_machines: [STP-L1-PR01]
data_label: 模擬資料
synthetic: true
author: team_sentinel
review_status: approved
reviewed_by: [ai_sim_reviewer_press_chief]
review_note: "AI 角色扮演審核（模擬資深維修課長），非真人專家審核"
review_date: "2026-10-21"
legal_basis:
  - 設施規則第57條（現行 113-08-01 版；115-06-30 修正版自 116-01-01 施行）：停止運轉及送料、上鎖及設置標示、危害防止計畫（含作業許可程序）、殘壓處理 [ref:REG-N0060009-57-p1, REG-N0060009-57-v20240801]
  - 設施規則第69條：金屬模安裝、拆模、調整及試模時使用安全塊、安全插梢或安全開關鎖匙 [ref:REG-N0060009-69]
  - 設施規則第70條：調整金屬模使滑塊動作時採用寸動；未具寸動機構者切斷動力電源 [ref:REG-N0060009-70]
  - 設施規則第254條：停電作業上鎖或標示「禁止送電」，由原掛簽人取下後才能復電 [ref:REG-N0060009-254-p1]
  - 機械設備器具安全標準第18條之1：伺服衝壓機械伺服系統故障時應有可停止滑塊的制動裝置 [ref:REG-N0060034-18-1]
  - OSHA 29 CFR 1910.147(d)、(e)、(f)(1)（程序範本，美國法規僅作參考） [ref:REG-OSHA-1910.147-d-1, REG-OSHA-1910.147-d-5, REG-OSHA-1910.147-e-3, REG-OSHA-1910.147-f-1]
permit:
  required: true
  approver_role: 現場主管
  hazard_plan_ref: HPP-STP-02          # 危害防止計畫編號（模擬）
  permit_form: PTW-STP（作業許可單，模擬編號）
  notes: 第57條新版要求危害防止計畫須含作業危害辨識評估、作業方法與安全管制、作業許可程序、作業安全檢點方法，並使作業勞工周知
energy_sources:
  - {id: E1, type: electrical, device: 主電源隔離開關 QS1（380 V／220 V 盤）, method: 切至 OFF＋個人鎖＋「禁止送電」標籤}
  - {id: E2, type: electrical_stored, device: 伺服驅動器直流母線電容（含儲能電容組，如有）, method: 斷電後等待放電（至少 10 分鐘，模擬值），由電氣合格人員以三用電表確認母線電壓 < 50 V（模擬值）}
  - {id: E3, type: pneumatic, device: 平衡缸／制動器氣源閥 V1, method: 必須等 E5 安全塊放妥後才關閉＋洩壓閥開啟＋鎖，確認氣壓表歸零；先洩壓會讓滑塊與上模重量全壓在馬達制動器上}
  - {id: E4, type: hydraulic, device: 過負荷保護油壓缸, method: 依機台指示洩壓，確認油壓表歸零（如有）}
  - {id: E5, type: gravity_slide, device: 滑塊與上模, method: 以寸動將滑塊停在上死點（或可放入安全塊的開模位置），於上下模間放入安全塊（第69條）；滑塊停在下死點附近無法退回時屬異常，保持上鎖並通知設備工程師}
  - {id: E6, type: feed_line, device: 送料機電源 QS2（STP-L1-FD02）, method: 連動上鎖，依 LOTO-FEED-01 處理（第57條「停止送料」）}
  - {id: E7, type: mechanical_stored, device: 模具內彈簧、氮氣彈簧, method: 不在受壓狀態下拆解；拆模時依模具資料釋放}
  - {id: E8, type: electrical_aux, device: 輔助設備電源（滑塊調整馬達、集中潤滑泵、模具噴油器、廢料輸送帶；獨立迴路者）, method: 個別切斷並上鎖；與 QS1 同迴路者以 E1 涵蓋，但仍要在驗證零能量時逐一按鈕確認}
  - {id: E9, type: pneumatic_hydraulic, device: 模墊（氣墊／油壓墊，如有）, method: 洩壓至 0 並確認壓力表歸零；未洩壓前頂出板可能上推，不得在其上方作業}
steps:
  - {"no": 1, action: 通知操作員、班長與受影響人員即將停機維修，並在 Kanban 工單記錄, check: 受影響人員簽名}
  - {"no": 2, action: 確認危害防止計畫與作業許可單已由現場主管核准, check: 許可單號}
  - {"no": 3, action: 以正常程序停機：按停止鈕使滑塊停在上死點，停止送料機, check: 目視滑塊靜止、送料停止}
  - {"no": 4, action: 依下列順序隔離：放入安全塊（E5）→ 主電源與輔助電源（E1、E8）→ 母線放電（E2）→ 平衡缸／制動器氣源（E3）→ 過負荷油壓與模墊（E4、E9）→ 送料機連動上鎖（E6）, check: 每項勾選}
  - {"no": 5, action: 每位進入危險區的作業人員，在每個隔離點掛上自己的個人鎖與標籤（多人作業用群組鎖箱）, check: 鎖號與人員登記}
  - {"no": 6, action: 洩除殘能：氣壓表歸零、油壓歸零、伺服母線放電完成；確認安全塊仍在上下模之間, check: 壓力讀值、母線電壓讀值、安全塊位置}
  - {"no": 7, action: 驗證零能量：確認人員離開危險區後，按沖床起動鈕、寸動鈕、滑塊調整鈕與送料機寸動鈕，確認都不動作，再把操作開關歸回 OFF, check: 兩人確認並簽名}
release:
  - 清點工具與零件，確認模具內、送料線上沒有遺留物
  - 恢復護圍、光幕與所有安全裝置的正常功能，並確認功能正常
  - 取出安全塊；確認所有人員離開危險區
  - 各作業人員自行取下自己的鎖與標籤，不得代取（第254條：由原掛簽人取下）
  - 原上鎖人不在場時，不得由他人剪鎖或代取；依廠內異常解鎖程序由主管確認該員不在廠內、聯絡本人並記錄後處理（參考 OSHA 1910.147(e)(3) 例外程序）
  - 通知受影響人員即將復電，由原上鎖人送電，先單動試沖確認無異常後再連續生產
testing_positioning:   # 需要短暫通電調整（例如寸動調模）時，OSHA 1910.147(f)(1) 的順序
  - 清除危險區內工具與人員；滑塊需要移動時先撤出安全塊
  - 由原上鎖人取下自己的鎖，現場主管在場
  - 只用寸動模式操作（第70條），完成後立即停機
  - 重新上鎖、放回安全塊並驗證零能量後，才能再把手伸入上下模之間
ai_constraints:
  - AI 不得宣告「已完成上鎖」或「可以復電」，只能提示下一步，並要求人員在 Kanban 勾選與簽名
  - 任何步驟涉及 E1～E9 → J4 needs_loto 必須為 true
  - AI 不得建議任何使光幕、連鎖、雙手操作或過負荷保護失效的作法
  - 伺服驅動器母線放電確認只能由電氣合格人員執行，AI 不得要求一般技術員量測
