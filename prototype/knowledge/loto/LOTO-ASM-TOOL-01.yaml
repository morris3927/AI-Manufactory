# 組裝站電動工具（電動起子鎖附站、人工組裝站／功能測試站）上鎖掛牌（LOTO）檢查表 —— 07_RAG知識庫資料.md §4.4
# data_label: 模擬資料。時間門檻皆為模擬值，非任何原廠規格。
# 組裝站的能源少、功率低，屬「輕量 LOTO」：以拔插頭＋插頭鎖蓋（或取下電池）、關氣源洩壓為主。
# 依據 OSHA 1910.147(a)(2)(iii)(A)：插頭式電動設備在拔除插頭、且插頭在維修者本人的專屬控制下時，可視為已控制意外起動。
# 本檔不切塊、不進向量庫；kb.loto_for(machine_type) 直接讀取。
loto_id: LOTO-ASM-TOOL-01
version: "0.1"
title: 組裝站電動起子、送釘機與受測機殼的停機、隔離與上鎖掛牌程序（輕量 LOTO）
machine_type: screwdriving_station
machine_types: [screwdriving_station, manual_assembly_station]
applies_to_machines: [ASM-L1-ST01, ASM-L1-ST02, ASM-L1-MA01, ASM-L1-MA02]
data_label: 模擬資料
synthetic: true
author: team_sentinel
reviewed_by: [ai_sim_reviewer_weld_asm]
review_status: approved
review_note: "AI 角色扮演審核，非真人專家審核"
legal_basis:
  - 設施規則第57條（現行 113-08-01 版；115-06-30 修正版自 116-01-01 施行）：維修、調整前停止運轉、上鎖及設置標示、殘壓（氣壓、彈簧）處理 [ref:REG-N0060009-57-p1, REG-N0060009-57-v20240801]
  - 設施規則第254條：停電作業上鎖或標示「禁止送電」，由原掛簽人取下後才能復電（本檢查表以插頭鎖蓋與標籤落實） [ref:REG-N0060009-254-p1]
  - OSHA 29 CFR 1910.147(a)(2)(iii)(A)：插頭式設備拔除插頭、插頭在維修者專屬控制下即可控制意外起動（美國法規僅作參考） [ref:REG-OSHA-1910.147-a-2-iii-A]
  - 職業安全衛生管理辦法第77條：電氣機械器具作業中檢點 [ref:REG-N0060027-77]
  - 設施規則第324條之1：重複性作業人因危害預防（換起子頭、清卡釘時注意姿勢） [ref:REG-N0060009-324-1]
permit:
  required: true
  approver_role: 班長
  hazard_plan_ref: HPP-ASM-01
  permit_form: PTW-ASM（簡化作業許可，模擬編號）
  notes: 換起子頭、清卡釘、量測扭力屬站內例行輕量維修，由班長在 Kanban 核准即可（簡化許可）；涉及受測機殼電源或控制器內部時改由電氣合格人員處理
energy_sources:
  - {id: A1, type: electrical, device: 電動起子控制器電源插頭（單相，模擬）或充電式起子電池, method: 拔下插頭並套上插頭鎖蓋＋個人標籤，插頭放在自己手邊；充電式起子取下電池}
  - {id: A2, type: pneumatic, device: 送釘機與治具夾持氣源球閥 V-A1, method: 關閉＋洩壓＋鎖；確認氣壓表歸零後才伸手進送釘軌道}
  - {id: A3, type: mechanical_stored, device: 扭力臂／懸吊平衡器彈簧、送釘機振動盤, method: 起子放回扭力臂定位座並鎖定；振動盤電源含在送釘機插頭（同 A1 方式）}
  - {id: A4, type: dut_power, device: 受測機殼在功能測試站的 AC 電源線與電源供應器, method: 關閉測試站輸出並拔除受測機殼電源線，等待至少 1 分鐘（模擬值）讓電源供應器放電；不得打開電源供應器外殼}
steps:
  - {"no": 1, action: 通知班長與同站作業員本站暫停，在 Kanban 工單記錄, check: 班長確認}
  - {"no": 2, action: 確認班長已核准簡化作業許可, check: 許可單號}
  - {"no": 3, action: 以正常程序停止：起子放回定位座、送釘機停止、測試站停止測試, check: 目視}
  - {"no": 4, action: 依 A1～A4 逐一隔離（只處理本次作業涉及的能源）, check: 每項勾選}
  - {"no": 5, action: 在插頭鎖蓋與氣源閥掛上自己的標籤，插頭保持在自己的專屬控制下, check: 標籤號碼登記}
  - {"no": 6, action: 洩除殘能：氣壓表歸零、受測機殼放電時間已到, check: 壓力讀值、時間}
  - {"no": 7, action: 驗證零能量：按起子啟動鍵與送釘鍵，確認不動作；測試站顯示無輸出, check: 本人確認}
release:
  - 清點工具與螺絲，確認送釘軌道、治具與機殼內沒有遺留物
  - 恢復送釘機護蓋與治具護罩
  - 由原上鎖人親自取下自己的插頭鎖蓋與標籤後插回電源，不得代取（第254條：由原掛簽人取下）
  - 打開氣源、恢復測試站輸出，做首件鎖附或首件測試，由班長確認
testing_positioning:
  - 需要通電試鎖、量測扭力或執行功能測試時：由原上鎖人取下自己的插頭鎖蓋並插回電源，班長知悉
  - 只在治具上用試片或報廢件試鎖；手指不得放在起子頭與送釘吸嘴下方
  - 完成後再拔插頭並套回插頭鎖蓋
ai_constraints:
  - AI 不得宣告「已完成上鎖」或「可以復電」，只能提示下一步並要求人員在 Kanban 勾選
  - 任何步驟涉及 A1～A4 → J4 needs_loto 必須為 true（輕量 LOTO 仍是 LOTO）
  - AI 不得建議修改扭力控制器的判定上下限來讓 NOK 變 OK，也不得建議停用鎖附數量計數或防錯功能
