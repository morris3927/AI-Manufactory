# 機器人 MIG 銲接工作站上鎖掛牌（LOTO）檢查表 —— 07_RAG知識庫資料.md §4.4
# data_label: 模擬資料。隔離點代號（QS-R1、V-R1…）、時間與電壓門檻皆為模擬值，非任何原廠規格。
# 本檔不切塊、不進向量庫；kb.loto_for(machine_type) 直接讀取，固定附在維修代理回答最前面。
loto_id: LOTO-WELD-ROBOT-01
version: "0.1"
title: 機器人 MIG 銲接工作站（六軸機器人、雙工位變位機、銲接電源、送絲機、清槍站）停機、隔離與上鎖掛牌程序
machine_type: robot_mig_cell
applies_to_machines: [WLD-L1-RC01, WLD-L1-RC02]
data_label: 模擬資料
synthetic: true
author: team_sentinel
reviewed_by: [ai_sim_reviewer_weld_asm]
review_status: approved
review_note: "AI 角色扮演審核，非真人專家審核"
legal_basis:
  - 設施規則第57條：現行 113-08-01 版要求停止運轉、上鎖或設置標示、殘壓處理；危害防止計畫（含作業許可程序）為 115-06-30 修正條文，116年1月1日施行 [ref:REG-N0060009-57-p1, REG-N0060009-57-v20240801]
  - 設施規則第254條：電路開路後作業時，開關上鎖或標示「禁止送電」「停電作業中」或派人監視；作業終了送電前確認作業勞工無感電之虞，並拆除短路接地器具與標誌後才送電 [ref:REG-N0060009-254-p1, REG-N0060009-254-p2]
  - OSHA 29 CFR 1910.147(e)(3)：鎖具／標籤由原上鎖人取下；原上鎖人不在時，須依雇主書面程序（確認不在廠內、盡力聯絡本人、復工前告知）處理（美國法規僅作參考） [ref:REG-OSHA-1910.147-e-3]
  - 工業用機器人危害預防標準第33條：進入可動範圍搶修前以緊急停止等方式停止運轉，攜帶安全栓，並在啟動開關處作禁止觸動之標示 [ref:REG-N0060025-33]
  - 工業用機器人危害預防標準第29條：氣壓系統分解或更換零件前排放驅動用汽缸內殘壓 [ref:REG-N0060025-29]
  - 工業用機器人危害預防標準第26、31、32條：可動範圍內作業時設監視人員或自持緊急停止開關；起動前確認可動範圍內無人 [ref:REG-N0060025-26, REG-N0060025-31, REG-N0060025-32]
  - 職業安全衛生管理辦法第60條：工業用機器人每日作業前檢點 [ref:REG-N0060027-60]
  - OSHA 29 CFR 1910.147(d)、(e)、(f)(1)（程序範本，美國法規僅作參考） [ref:REG-OSHA-1910.147-d-1, REG-OSHA-1910.147-e-3, REG-OSHA-1910.147-f-1]
permit:
  required: true
  approver_role: 現場主管
  hazard_plan_ref: HPP-WLD-01          # 危害防止計畫編號（模擬）
  permit_form: PTW-WLD（作業許可單，模擬編號）
  hot_work: 維修中若需在銲接工作站以外研磨、補銲或切割（例如修補治具），另依廠內規定申請動火許可，作業前清除周圍可燃物並備妥滅火器（設施規則第173條；OSHA 1910.252(a)(2)(iv)），本檢查表不取代動火許可 [ref:REG-N0060009-173, REG-OSHA-1910.252-a-2-iv]
  notes: 本檢查表的作業許可為廠內管理程序（現行第57條未明定作業許可）；工作站內的試銲屬既有銲接作業區的正常作業，但必須在局部排氣運轉正常時才可進行（設施規則第292條）
energy_sources:
  - {id: R1, type: electrical, device: 機器人控制器主電源 QS-R1, method: 切至 OFF＋個人鎖＋「禁止送電」標籤}
  - {id: R2, type: electrical, device: 銲接電源主開關 QS-W1（含送絲機）, method: 切至 OFF＋個人鎖；送絲機與銲槍不得帶電}
  - {id: R3, type: electrical_stored, device: 機器人伺服驅動器與銲接電源內部電容, method: 斷電後等待放電（至少 5 分鐘，模擬值），由電氣合格人員確認無殘餘電壓；一般技術員不得打開控制器或銲接電源機殼}
  - {id: R4, type: gravity, device: 機器人手臂（各軸馬達煞車）, method: 停機前將機器人移到維修姿勢（手臂收回、銲槍朝下靠近地面）；不得手動釋放煞車}
  - {id: R5, type: pneumatic, device: 治具夾爪與定位氣缸氣源閥 V-R1, method: 關閉＋洩壓＋鎖；洩壓前先確認工件已取下或有支撐，避免夾爪鬆開時工件掉落}
  - {id: R6, type: mechanical_stored, device: 雙工位變位機（轉台）, method: 停在定位並插入轉台鎖定銷；變位機電源已含在 R1}
  - {id: R7, type: shielding_gas, device: 保護氣體供氣閥 V-G1（氣瓶或匯流排）, method: 關閉＋鎖；氣瓶直立固定（設施規則第106條）}
  - {id: R8, type: coolant, device: 水冷銲槍冷卻水機, method: 停機並關閉進回水閥；拆管前以容器承接，冷卻水可能仍有壓力與溫度}
  - {id: R9, type: thermal, device: 銲槍、導電嘴、噴嘴、工件與清槍站, method: 停弧後等待冷卻（至少 10 分鐘，模擬值）或戴耐熱手套}
  - {id: R10, type: mechanical_stored, device: 銲絲張力（送絲機至導電嘴）, method: 鬆開送絲輪壓臂；銲絲端部尖銳，剪斷前先夾持，避免銲絲彈出刺傷}
steps:
  - {"no": 1, action: 確認作業許可已由現場主管核准，許可單列出本次隔離點（R1～R10）；需在工作站外動火時另確認動火許可；核准後才開始停機與隔離, check: 許可單號}
  - {"no": 2, action: 通知操作員、班長與相鄰工作站人員即將停機維修，並在 Kanban 工單記錄, check: 受影響人員簽名}
  - {"no": 3, action: 以正常程序停機：機器人以循環停止（cycle stop）停在原點，再移到維修姿勢；按下緊急停止, check: 目視機器人靜止、HMI 顯示停止}
  - {"no": 4, action: 依 R1～R10 逐一隔離, check: 每項勾選}
  - {"no": 5, action: 每位進入圍欄的作業人員在每個隔離點掛個人鎖與標籤，攜帶自己的安全栓（模式鑰匙），並在啟動開關處掛「禁止觸動」標示（多人作業用群組鎖箱）, check: 鎖號與人員登記}
  - {"no": 6, action: 洩除殘能：夾爪氣壓表歸零、轉台鎖定銷插入、保護氣與冷卻水閥關閉；電容放電由電氣合格人員確認, check: 壓力讀值、鎖定銷位置}
  - {"no": 7, action: 驗證零能量：確認人員離開圍欄後，在教導器與操作盤按起動，確認機器人、變位機、送絲機都不動作，銲接電源無輸出，再把開關歸回 OFF, check: 兩人確認並簽名}
release:
  - 清點工具與零件，確認圍欄內、治具與變位機上沒有遺留物
  - 恢復安全門連鎖、光電式安全裝置與所有護罩，並確認功能正常
  - 確認所有人員離開機器人可動範圍（工業用機器人危害預防標準第32條）
  - 各作業人員自行取下自己的鎖與標籤，不得代取（參考 OSHA 1910.147(e)(3)）
  - 送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；通知受影響人員即將復電，由原上鎖人送電；以教導模式低速空跑一個循環確認路徑無干涉，確認局部排氣運轉後才試銲
testing_positioning:   # 需要短暫通電寸動機器人、量測或試銲時，OSHA 1910.147(f)(1) 的順序
  - 清除圍欄內工具；需留在可動範圍內的人員只限持教導器者
  - 由原上鎖人取下自己的鎖，現場主管在場，並在圍欄外安排監視人員（第26條）
  - 只用教導模式降速操作，持教導器者握住致能開關，放手即停（第5、9條）；試銲時人員退到圍欄外並確認局部排氣運轉
  - 完成後立即停機，重新上鎖並驗證零能量，才能再次進入圍欄
ai_constraints:
  - AI 不得宣告「已完成上鎖」或「可以復電」，只能提示下一步，並要求人員在 Kanban 勾選與簽名
  - 任何步驟涉及 R1～R10 或需進入機器人圍欄 → J4 needs_loto 必須為 true
  - AI 不得建議修改機器人的安全相關參數（速度限制、安全區域、碰撞偵測靈敏度），也不得建議使安全門連鎖或光電式安全裝置失效的作法
  - AI 不得建議手動釋放機器人煞車；伺服驅動器與銲接電源內部的放電確認只能由電氣合格人員執行
