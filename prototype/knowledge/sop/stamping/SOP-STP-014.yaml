verify:
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 由原上鎖人暫時解除、主管在場，以寸動與送料機單獨送料驗證：連續量測送料長度，並觀察導正銷進入導正孔時滾輪是否已放開；判定：連續 20 次（模擬值）送料長度誤差均在 ±0.03 mm（模擬值）內，釋放角度與設定表差在 2°（模擬值）以內，且滾輪放開時導正銷已進入導正孔 → 合格
- 低速試沖少量料帶，檢查導正孔、導正銷、毛邊與料帶定位；判定：試沖 30 件（模擬值）後，導正孔無新增單向拉長、導正銷無亮面擴大或斷裂、毛邊高度不超過 0.08 mm（模擬值），且送料長度誤差維持在 ±0.03 mm（模擬值）內 → 合格；若重現單向拉長 → 改走 SOP-STP-021 或通知設備工程師／原廠技師。
- 建立參數與首件紀錄：將調整後導正釋放角度、沖速 SPM 與首件導正孔位置拍照建檔，並觀察連續生產狀況；判定：首件導正孔位置與模具資料相符，連續生產 2 小時（模擬值）無定位不良、無異常毛邊或跳屑 → 結案；若再出現改沖速後才發生 → 回查參數變更流程並通知設備工程師。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 調整導正釋放角度後，導正孔仍持續單向拉長或導正銷斷裂 → （改走 SOP-STP-021 檢查模具定位偏移，或通知設備工程師／原廠技師）
- 送料長度誤差逐步累積且滾輪表面有亮帶或油污 → （改走 SOP-STP-012 檢查送料滾輪磨損／打滑）
- 氣源壓力無法維持 4.8 bar（模擬值）以上或導正釋放氣缸動作不穩 → （改走 SOP-STP-055 檢查氣源壓力不足）
lessons: 導正銷不是有插到就好；釋放時機要跟送料停止、沖速與參數變更一起看，調完一定要用寸動與試沖重新驗證。
