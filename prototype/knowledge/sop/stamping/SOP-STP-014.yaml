symptoms:
- 導正孔單向拉長
- 導正銷磨亮或斷裂
- 送料數值正常但料帶定位不良
- 改沖速後才出現
- 導正孔被拉成單邊橢圓，孔口有一側特別亮。
- 導正銷磨亮、起毛或斷銷，換新後短時間又出現。
- 送料數值看起來正常，但料帶定位不穩、步距跑掉（現場也會說 pitch 跑掉）。
- 改沖速或調過導正釋放角度後才開始發生。
- 連續模偶發毛邊或跳屑，定位不良時好時壞。
