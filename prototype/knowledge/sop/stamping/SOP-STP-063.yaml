  criteria: 料環在 3 秒（模擬值）內建立，高度維持在設定值 ±30 mm（模擬值），且無 LOOP_FAULT，可排除料環設定造成之卡料；若反覆 LOOP_FAULT 但料帶無殘留捲曲，改懷疑送料滾輪打滑（SOP-STP-012）或誤送料偵測器誤報（SOP-STP-041）。
  caution: 寸動時手不得靠近滾輪與料環區；僅以寸動確認，不得連續運轉。
