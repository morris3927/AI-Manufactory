  action: 在整平機出口與進料口之間，目視並手感檢查料帶是否有翹頭、弓形或波浪狀殘留捲曲；將料帶自然放平於非金屬平台上，觀察離平台間隙與貼合狀況。
  criteria: 若每 1 m 料帶離平台間隙超過 1.5 mm（模擬值），或目視有明顯弓形／翹頭，判定整平量不足，支持本模式；若料帶平整但持續往同一側偏移，先改懷疑 coil_camber（SOP-STP-009），不要只調整平輥。
  caution: 料帶邊緣可能銳利，搬動時戴防割手套；不可將手指伸入整平輥隙。
