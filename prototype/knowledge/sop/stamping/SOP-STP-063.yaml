- 'no': 5
  phase: inspect
  action: 核對整平機實際輥壓下量／間隙與該料厚、材質之設定表，並確認是否沿用前一料捲設定；以厚薄規量測輥隙。
  criteria: 實際壓下量與設定表差超過 0.1 mm（模擬值），或設定表選用錯誤、沿用前一料捲參數，判定本模式；若設定與設定表相符，但沖壓力峰值相對換料前出現一次階躍 5% 以上（模擬值）且同一料捲反覆，改懷疑 material_thickness_dev（SOP-STP-007）。
  caution: 量測前確認料帶已鬆弛、張力已釋放，避免料帶突然抽動。
  requires_supervisor: false
  requires_energized: false
