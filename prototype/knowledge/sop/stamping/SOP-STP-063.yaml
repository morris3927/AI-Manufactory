  criteria: 側彎量超過 1.5 mm/m（模擬值）且料帶持續往同一側偏、越往後段工站偏移越大，判定為 coil_camber（SOP-STP-009），不是本模式；若側彎量在 1.5 mm/m（模擬值）以內，但翹曲或弓形超標，則判定本模式。
  caution: 量測時料帶可能回彈，應壓住料帶兩端。
