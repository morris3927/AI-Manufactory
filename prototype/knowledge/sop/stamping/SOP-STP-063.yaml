verify:
- 以寸動送料 3 個步距（模擬值），觀察料帶在整平機出口、進料口與第一工站是否平順，料環是否穩定；判定：3 個步距（模擬值）內無卡料、無料頭翹起撞擊；料環高度維持設定值 ±30 mm（模擬值）；無 LOOP_FAULT。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 試沖 5 件（模擬值），確認送料步距、料帶翹曲與沖壓力峰值；判定：5 件（模擬值）內無 MISFEED、無 OVERLOAD；料帶翹曲量不超過 1.5 mm（模擬值）；送料步距誤差不大於 0.10 mm（模擬值）。
- 連續生產 30 分鐘（模擬值），觀察料環、進料口與沖壓力峰值變化；判定：30 分鐘（模擬值）內無 LOOP_FAULT、無進料口卡料；沖壓力峰值變動不超過 3%（模擬值）。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 重新設定後仍反覆 LOOP_FAULT 或進料口卡料，且料帶側彎量超過 1.5 mm/m（模擬值） → 改走 SOP-STP-009（料捲側彎／料帶偏移）。
- 沖壓力峰值相對換料前階躍 5% 以上（模擬值），同一料捲反覆，換回前一捲即恢復 → 改走 SOP-STP-007（材料厚度／硬度偏差）。
- 設定表與實際相符、料帶無殘留捲曲，但送料長度逐步變短或滾輪有打滑聲 → 改走 SOP-STP-012（送料滾輪磨損／打滑）；必要時通知設備工程師／原廠技師。
lessons: 換料捲時，料厚、材質、整平壓下量與料環高度要一起對表；不要只改送料長度，讓上一捲的設定留給下一捲。
