verify:
- 在主管在場、由原上鎖人依程序暫時解除上鎖後，以寸動讓送料機低速送料，確認滾輪轉動平順、無異音、驅動器無警報；判定：連續 10 次寸動（模擬值）無 FD_OVERCURRENT／FD_POS_DEV；馬達電流峰值不超過額定 120%（模擬值）。
- 以料帶或標準尺規量測送料長度 20 次（模擬值），並在運轉穩定後量馬達溫度；判定：送料長度誤差在 ±0.05 mm（模擬值）內；馬達外殼溫度不超過 70 °C（模擬值）；由電氣合格人員以鉤表量測三相電流，不平衡不超過 10%（模擬值）
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 會同模具技師以低速寸動試沖 5 沖次（模擬值），確認料帶步距、導正銷入孔、脫料與排屑正常，沖床連動無異常；判定：5 沖次（模擬值）內無警報、無跳屑、無毛邊異常，導正銷未撞模；若再現 FD_OVERCURRENT／FD_POS_DEV，停止並升級。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 送料長度誤差在 5～15 分鐘（模擬值）內逐步累積、滾輪表面有亮帶或油污 → 改走 SOP-STP-012。
- 誤送料偵測反覆觸發但料帶位置與導正孔正常 → 改走 SOP-STP-041；若換料厚或材質後料帶殘留捲曲、料環異常 → 改走 SOP-STP-063。
- 更換驅動器散熱風扇、編碼器聯軸器及馬達傳動後仍出現 FD_OVERCURRENT／FD_POS_DEV，或馬達絕緣電阻低於 1 MΩ（模擬值） → 通知設備工程師／原廠技師。
lessons: 驅動器警報先分清是「單一沖次突然停」還是「誤差慢慢累積」；前者查驅動與馬達，後者先查滾輪與整平，不要一看到警報就換驅動器。
