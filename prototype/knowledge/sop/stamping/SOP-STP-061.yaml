  criteria: 若 alarm_code 為 FD_OVERCURRENT 或 FD_POS_DEV，且 feed_length_error_mm 在停機前維持 ±0.03 mm（模擬值）內、電流出現尖峰、溫度 >75 °C（模擬值），判定偏向本模式；若送料長度誤差在 5～15 分鐘（模擬值）內逐步累積，改懷疑 feed_roller_wear（SOP-STP-012）。
