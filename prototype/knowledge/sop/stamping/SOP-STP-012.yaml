  phase: inspect
  action: 在已完成上鎖掛牌狀態下，目視檢查送料滾輪表面、料帶路徑與料帶表面；以無絨布擦拭滾輪亮帶處，確認是否有油污、粉塵或金屬屑附著。
  criteria: 滾輪表面出現連續亮帶、油污或料帶有平行滑痕，且滾輪無明顯崩角，判定符合本模式；若滾輪表面正常但料帶有局部壓痕或厚度異常，改懷疑 material_thickness_dev（SOP-STP-007）。
  caution: 不可用手直接轉動滾輪或伸入滾輪咬合點；需確認滾輪抬升氣缸已洩壓。
