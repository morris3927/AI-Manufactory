- 'no': 8
  phase: inspect
  action: 需要通電量測或移動滑塊時，依 LOTO-FEED-01 測試／定位程序：需要通電量測送料長度時：清除人員、由原上鎖人取下自己的鎖、現場主管在場；只用寸動或送料機單獨試送（料帶不進模），手不得進入滾輪夾捲點；量劃線長度時送料機須停止；量測完成後重新上鎖並驗證零能量
  caution: 通電期間手不得進入模具區或滾輪夾捲點；測試／定位只限寸動調整與讀值，不得用來試沖或連續生產
