  - L13
- 'no': 5
  phase: inspect
  action: 用分厘卡量測料帶厚度，距料邊 20 mm（模擬值）以上取 5 點（模擬值），並查閱換料捲紀錄與沖壓力峰值趨勢。
  criteria: 料厚實測在圖面公差內（例如 0.8 mm 料以 ±0.05 mm 管制，模擬值），且換料捲前後沖壓力峰值沒有一次階躍超過 5%（模擬值），排除 material_thickness_dev；若厚度超差或換料捲後 30 分鐘內（模擬值）才開始異常，改走 SOP-STP-007。
  caution: 量測時避開料帶毛邊與油膜堆積處，以免讀值失真。
  requires_supervisor: false
  requires_energized: false
  ref:
  - S4
- 'no': 6
  phase: inspect
  action: 以分厘卡量測上下滾輪直徑（左、中、右 3 點，模擬值）並以量錶量測偏擺；檢查滾輪壓緊彈簧壓縮量、滾輪軸承徑向間隙與左右兩側壓緊力，並目視導正銷有無磨亮或導正孔有無單向拉長
  criteria: 滾輪直徑較基準磨耗 0.05 mm 以上（模擬值）、左右直徑差 0.02 mm 以上（模擬值）、偏擺超過 0.02 mm（模擬值）、軸承徑向間隙超過 0.05 mm（模擬值），或左右壓緊力差超過 10%（模擬值）→ 判定滾輪磨損／打滑；以上都正常但導正銷磨亮、導正孔單向拉長 → 改懷疑 pilot_release_timing（SOP-STP-014）
  caution: 拆卸軸承前需支撐滾輪，避免滾輪掉落或夾傷。
  requires_supervisor: false
  requires_energized: false
  ref:
  - L13
  - S4
- 'no': 7
  phase: inspect
  action: 調閱停機前 MES／Sentinel 已記錄的 feed_length_error_mm、送料機警報與馬達電流趨勢（不需對送料機送電），確認送料停止前是否有逐步累積的長度誤差
  criteria: 若紀錄顯示 feed_length_error_mm 在 15 分鐘（模擬值）內由約 0.02 mm（模擬值）斜坡上升到 0.15 mm（模擬值）以上，且無過電流或位置偏差過大警報，判定本模式；若出現單沖瞬間停止、過電流或位置偏差過大警報，改懷疑 servo_feeder_drive_alarm（SOP-STP-061）。
  caution: 只讀紀錄，不要為了看紀錄而送電或起動送料機
  requires_supervisor: false
  requires_energized: false
