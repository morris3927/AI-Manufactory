verify:
- 以寸動方式低速送料 20 次（模擬值），每次設定送料長度 50.00 mm（模擬值），量測實際送料長度並記錄誤差趨勢；判定：送料長度誤差 ≤0.03 mm（模擬值），且 20 次（模擬值）內無逐步累積或單次跳變；若誤差仍由 0.02 mm（模擬值）累積到 0.15 mm（模擬值）以上，判定未修復，重新檢查滾輪壓緊力與軸承。
- 寸動送料後目視檢查料帶表面與滾輪表面，確認有無新增滑痕或亮帶擴大；判定：料帶表面無新增平行滑痕，滾輪亮帶不再擴大；若仍有滑痕且送料誤差正常，改懷疑 pilot_release_timing（SOP-STP-014）。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動方式配合導正銷試沖 10 次（模擬值），檢查導正孔、導正銷與沖壓力峰值；判定：導正孔無新增橢圓化，導正銷無異常磨亮；沖壓力峰值與修復前基準差異在 5%（模擬值）以內。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 料厚實測超出圖面公差，或換料捲後 30 分鐘內（模擬值）才開始異常 → 改走 SOP-STP-007。
- 送料機單獨試送（料帶不進模）誤差在 ±0.03 mm（模擬值）以內，但導正孔單向拉長或導正銷磨亮 → 改走 SOP-STP-014。
- 出現送料機過電流、位置偏差過大警報或單沖瞬間停止 → 改走 SOP-STP-061；更換滾輪後誤差仍超過 0.05 mm（模擬值） → 通知設備工程師／原廠技師。
lessons: 滾輪打滑是「慢慢偏」不是「突然跳」，看到送料誤差斜坡上升，先量料厚、再看滾輪亮帶與壓緊力，不要只調參數。
