- 'no': 9
  phase: inspect
  action: 由原上鎖人暫時解除上鎖、主管在場：先讓送料機單獨無料空轉 10 次（模擬值），比對驅動器指令與編碼器回授；再夾持短料帶讓送料機單獨送料 10 次（模擬值，料帶不進模、導正銷不作用），每次設定 50.00 mm（模擬值），停機後以鋼尺量測料帶上的劃線間距
  criteria: 空轉時指令與回授一致，但夾料後實際送料長度逐步偏短、累積到 0.15 mm（模擬值）以上 → 判定滾輪打滑；夾料單獨送料長度正常（±0.03 mm 以內，模擬值）但導正孔單向拉長 → 改懷疑 pilot_release_timing（SOP-STP-014）
