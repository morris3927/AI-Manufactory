verify:
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 通電後以寸動方式試沖 3～5 次（模擬值），同時觀察噸位峰值與左右平衡；判定：噸位峰值較研磨前下降 3～8%（模擬值），並回到基準值 ±5%（模擬值）內；左右沖壓力差在 5% 以下（模擬值）；無異音、無跳屑。
- 量測試沖首件的毛邊高度與斷面光亮帶比例；判定：毛邊高度在 0.08 mm 以下（模擬值），斷面光亮帶比例回復至 30% 以上（模擬值），判定修復完成。
- 連續生產 200 件（模擬值）後，再抽檢 5 件（模擬值）量測毛邊高度並比對噸位趨勢；判定：毛邊高度無逐步上升趨勢，且噸位峰值變動在 ±3%（模擬值）內，即可結案；若毛邊再度升高，重新執行 inspect 並評估是否改走其他模式。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 研磨後噸位峰值仍高於基準 8%（模擬值）以上，或左右沖壓力差超過 10%（模擬值） → 改走 SOP-STP-021（模具定位偏移）
- 刃口崩缺深度超過 0.30 mm（模擬值），或模仁本體出現龜裂 → 通知設備工程師／原廠技師
- 沖次未達基準 80,000 次（模擬值）但毛邊持續升高並伴隨拉痕、黏模 → 改走 SOP-STP-035（模具潤滑不足）
lessons: 毛邊是刃口在跟你說話：先看沖次與噸位趨勢、再動手拆模，才不會把定位或潤滑問題當成磨耗處理。
