verify:
- 沖床主電源保持上鎖，以噴油器手動噴油測試確認各噴油嘴霧化狀況與噴油脈衝次數；判定：每個噴嘴都有均勻油霧、無滴油，噴油次數達 6 次／分以上（模擬值），die_lube_pulse_per_min 無 step_down 現象。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以單動（一行程一停止）低速試沖料帶 30 件（模擬值），逐件檢查成形面外觀與毛邊高度；判定：成形面無拉痕、無黏模、無料屑附著，毛邊高度不超過 0.08 mm（模擬值），成形尺寸在公差內
- 恢復正常生產後連續沖製 500 件（模擬值），每 100 件（模擬值）抽查一次成形面與模具潤滑油箱液位；判定：拉痕不良件數為 0 件（模擬值），模具潤滑油箱液位下降不超過 5%（模擬值），未再出現 DIE_LUBE_LOW 警報。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 補油、清洗噴嘴並恢復噴油後，試沖 30 件（模擬值）仍出現拉痕或黏模 → 改走 SOP-STP-033（刃口／沖頭磨耗）檢查沖頭與模仁刃口。
- 噴油脈衝正常，但機台集中潤滑泵壓力低於下限或導軌溫度超過 60 °C（模擬值）並伴隨滑塊異音 → 改走 SOP-STP-057（機台集中潤滑異常）。
- 模具潤滑油箱反覆出現低液位或油路持續堵塞，現場無法排除 → 通知設備工程師／原廠技師。
lessons: 拉痕先看油、再看刃口：油霧正常、沖次未超基準，就不要急著拆模具，先把噴油次數與油路查清楚。
