- 'no': 4
  phase: inspect
  action: 查看集中潤滑油箱油位計、泵浦附近壓力表與油管接頭；比對現場點檢表及警報紀錄中之 CENTRAL_LUBE_LOW 與 lube_pressure_bar 趨勢。
  criteria: 油位低於油位計下限，或現場壓力表曾低於 1.0 bar（模擬值），且警報紀錄有 CENTRAL_LUBE_LOW → 支持本模式；若油位正常、壓力維持在 1.0 bar（模擬值）以上，且只有模具表面拉痕 → 改懷疑 die_lubrication_insufficient。
  caution: 油品可能造成滑倒，地面油污先以吸油布處理。
  requires_supervisor: false
  requires_energized: false
  ref:
  - L3
- 'no': 5
  phase: inspect
  action: 沿潤滑泵至分配閥、導軌與曲軸軸承之油路，檢查油管有無壓扁、硬化、滲漏、接頭鬆脫；拆開分配閥出口接頭查看出油。
  criteria: 油管滲漏、壓扁、接頭鬆脫，或分配閥出口無油流出 → 支持本模式；若油路外觀正常且各潤滑點有油，但模具噴油器油箱低液位或噴油次數下降 → 改懷疑 die_lubrication_insufficient。
  caution: 拆接頭前以擦拭布承接殘油；不得用壓縮空氣對油管吹氣，以免油霧噴濺。
  requires_supervisor: false
  requires_energized: false
  ref:
  - L13
- 'no': 6
  phase: inspect
  action: 以點溫計量測導軌、曲軸軸承座與相鄰軸承溫度，並查看溫度趨勢；同時聽診滑塊異音。
  criteria: 軸承座或導軌溫度超過 60 °C（模擬值），或同一軸承在數小時內由約 40 °C（模擬值）緩升至 60 °C（模擬值）以上，且與相鄰點差超過 10 °C（模擬值）→ 支持本模式；若溫度正常、換模後才發生，且平衡缸壓力與模具資料差超過 0.3 bar（模擬值）→ 改懷疑 counterbalance_misset。
  caution: 點溫計應對準軸承座金屬面，勿量旋轉中飛輪或皮帶。
  requires_supervisor: false
  requires_energized: false
  ref:
  - L2
  - L13
- 'no': 7
  phase: inspect
  action: 【現場經驗（模擬）】檢查成形件表面、模仁、脫料板有無拉痕、黏模或料屑附著，並查看模具噴油器噴油次數與模具潤滑油箱液位；機台集中潤滑異常通常不會先反映在製品表面
  criteria: 成形件表面有拉痕、黏模或料屑附著，且模具潤滑油箱低液位或噴油次數下降 → 改懷疑 die_lubrication_insufficient（SOP-STP-035）；若製品與模具表面正常，只有集中潤滑警報、油位低或軸承溫升 → 判定為本模式。
  caution: 檢查模仁時使用護目鏡與防割手套，勿將手伸入閉模區。
  requires_supervisor: false
  requires_energized: false
  ref:
