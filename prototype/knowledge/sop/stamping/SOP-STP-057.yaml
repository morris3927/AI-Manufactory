verify:
- 需要通電量測或移動滑塊時，依 LOTO-PRESS-SERVO-01 測試／定位程序：清除危險區內工具與人員；滑塊需要移動時先撤出安全塊；由原上鎖人取下自己的鎖，現場主管在場；只用寸動模式操作（第70條），完成後立即停機；重新上鎖、放回安全塊並驗證零能量後，才能再把手伸入上下模之間
- 由原上鎖人依測試程序暫時解除後，手動起動集中潤滑泵，觀察壓力表在 5 分鐘內（模擬值）建立至 1.0 bar（模擬值）以上，並檢查各接頭無滲漏；判定：壓力達 1.0 bar（模擬值）以上且無滲漏 → 通過；若壓力無法建立或 CENTRAL_LUBE_LOW 再出現 → 通知設備工程師／原廠技師。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動試沖 3 次（模擬值）後停機，檢查製品與模具表面有無拉痕、黏模、料屑；確認模具潤滑噴油次數正常；判定：製品表面無拉痕、黏模、料屑，且集中潤滑壓力維持 1.0 bar（模擬值）以上 → 通過；若出現拉痕、黏模或料屑 → 改懷疑 die_lubrication_insufficient，改走 SOP-STP-035
- 恢復生產後 2 小時（模擬值）內追蹤 bearing_temp_c 趨勢與集中潤滑壓力，並以聽診棒確認滑塊異音（寸動幾個行程看不出溫升）；判定：軸承溫度不再爬升並穩定在 60 °C 以下（模擬值），集中潤滑壓力維持 1.0 bar（模擬值）以上，無異常異音 → 完成；溫度仍上升或異音加劇 → 通知設備工程師／原廠技師
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 補油、清洗濾網與更換油管後，集中潤滑壓力仍低於 1.0 bar（模擬值）或 CENTRAL_LUBE_LOW 重複出現 → 通知設備工程師／原廠技師。
- 軸承溫度超過 60 °C（模擬值）且持續上升，或滑塊異音加劇 → 通知設備工程師／原廠技師。
- 製品表面出現拉痕、黏模或料屑，且模具潤滑油箱低液位或噴油次數下降 → 改走 SOP-STP-035。
lessons: 集中潤滑警報不要只按復歸；先看油位與壓力，再摸軸承溫度，才不會把機台潤滑問題誤判成模具拉傷。
