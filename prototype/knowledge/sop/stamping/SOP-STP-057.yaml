- 'no': 8
  phase: repair
  action: 補充集中潤滑油至油位計標示範圍內，清潔加油口與油位計；確認使用現場指定之潤滑油。
  caution: 不同黏度或不同種類油品不得混用；油品接觸皮膚應立即擦拭。
  requires_supervisor: false
  requires_energized: false
  ref:
  - L3
- 'no': 9
  phase: repair
  action: 拆洗或更換吸入濾網、分配閥濾網，以及壓扁、硬化或滲漏之油管與接頭。
  caution: 拆油管前確認泵浦停止且無殘壓；使用不易掉棉絮之擦拭布。
  requires_supervisor: false
  requires_energized: false
  ref:
