- 'no': 11
  phase: repair
  action: 以手動泵浦對各潤滑點加壓，確認導軌與曲軸軸承油孔出油順暢，油路無氣阻。
  caution: 加壓時人員避開油管接頭方向，避免殘油噴濺。
