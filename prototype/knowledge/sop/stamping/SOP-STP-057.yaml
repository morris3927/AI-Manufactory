- 'no': 3
  phase: isolate
  action: 依 LOTO-PRESS-SERVO-01（伺服沖床） 或 LOTO-PRESS-MECH-01（機械沖床）執行停機、隔離、上鎖掛牌、洩除殘能並驗證零能量；送料機依各檢查表的送料線隔離點連動上鎖（兩台都要上鎖，不是擇一）
  caution: 集中潤滑泵可能由獨立迴路供電，上鎖時須確認泵浦電源與主電源一併隔離並掛牌，避免他人誤起動。
  requires_supervisor: true
  requires_energized: false
  ref:
