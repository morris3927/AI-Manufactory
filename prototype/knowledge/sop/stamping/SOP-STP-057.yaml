- 'no': 10
  phase: repair
  action: 由電氣合格人員檢查低油位開關與壓力開關接點動作，量測斷開與閉合狀態；異常時更換同規格通用件。
  caution: 不得以任何方式使開關失去動作；電氣檢查須由電氣合格人員執行。
  requires_supervisor: false
  requires_energized: false
