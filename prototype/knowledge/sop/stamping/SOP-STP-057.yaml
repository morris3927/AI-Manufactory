symptoms:
- 軸承溫升
- 導軌異音
- 集中潤滑警報
- 潤滑油位低
- 集中潤滑警報燈亮，HMI 出現 CENTRAL_LUBE_LOW。
- 潤滑油位低於油位計下限，或補油後很快又下降。
- 滑塊或導軌有異音，聽起來像乾摩擦。
- 曲軸軸承溫度在數小時內慢慢升高。
- 模具與製品表面看起來沒有拉痕或黏模。
