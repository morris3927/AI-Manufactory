verify:
- 需要通電量測或移動滑塊時，依 LOTO-PRESS-SERVO-01 測試／定位程序：清除危險區內工具與人員；滑塊需要移動時先撤出安全塊；由原上鎖人取下自己的鎖，現場主管在場；只用寸動模式操作（第70條），完成後立即停機；重新上鎖、放回安全塊並驗證零能量後，才能再把手伸入上下模之間
- 由原上鎖人暫時解除、主管在場，以寸動讓滑塊上下空轉 3 次（模擬值），確認動作順暢、無異音、無卡滯；判定：寸動全程無異常負載、無異音，滑塊停止位置正常，過負荷保護未動作。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以料帶寸動試沖 3 次（模擬值），讀取每次沖壓力峰值；判定：峰值低於過負荷設定值的 90%（250 t 機台約 200 t、200 t 機台約 160 t，模擬值），三次差異 ≤5%（模擬值），無 OVERLOAD 或 DOUBLE_BLANK 警報
- 以低速連續試沖 10 次（模擬值），觀察噸位曲線、料帶步距與廢料排出；判定：無 OVERLOAD 警報，噸位曲線無單一尖峰，料帶步距誤差在 ±0.10 mm（模擬值）內，廢料排出順暢。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 滑塊卡在下死點無法退回，或過負荷保護油壓缸無法洩壓 → 保持上鎖掛牌，通知設備工程師／原廠技師。
- 清除雙料／異物後，寸動試沖峰值仍超過過負荷設定值（模擬值）或重複出現 OVERLOAD，或閉模高度讀值與模具資料差 >0.2 mm（模擬值）→ 改走 SOP-STP-023（閉模高度設定錯誤）。
- 料帶厚度實測與標示差 >0.05 mm（模擬值）且換料後出現階躍 → 改走 SOP-STP-007（材料厚度／硬度偏差）；若廢料滑道堵塞或輸送帶電流異常 → 改走 SOP-STP-065（廢料排出堵塞）。
lessons: 過負荷多為單一沖次尖峰，先查雙料、料頭重疊與模內異物，再查料厚與廢料排出；不可忽略 OVERLOAD 警報直接復歸。
