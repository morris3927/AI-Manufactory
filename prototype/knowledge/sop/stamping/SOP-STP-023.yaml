verify:
- 由原上鎖人暫時解除、主管在場，以寸動將滑塊寸動至下死點，比對 HMI 閉模高度與機械指示；判定：差值 ≤ 0.05 mm（模擬值），且左右調整機構刻度一致。
- 以寸動走一次空行程（無料），確認滑塊到下死點時模具閉合無干涉、無異音；判定：無干涉、無異音；沖壓力峰值與左右平衡留到下一步有料試沖時確認（無料空打讀不到沖壓力）
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動方式試沖首件 3 件（模擬值），量測成形高度、壓印深度與毛邊高度；判定：尺寸落在圖面公差 ±0.05 mm（模擬值）內，毛邊高度 ≤ 0.08 mm（模擬值），無單側毛邊或導正孔壓痕；沖壓力峰值落在模具資料設定值 ±5%（模擬值）內、左右平衡 ≤ 5%（模擬值）
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若閉模高度調整後，左右沖壓力差仍 > 10%（模擬值）或出現單側毛邊 → 改走 SOP-STP-021（模具定位偏移）。
- 若沖壓力峰值單次超過過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值）且過負荷保護動作 → 改走 SOP-STP-053（過負荷（噸位超限））。
- 若調整機構鎖固件損壞、刻度無法定位，或感測器校正後偏差仍 > 0.05 mm（模擬值） → 通知設備工程師／原廠技師。
lessons: 換模後不要只看首件外觀，閉模高度讀值與模具資料卡一定要逐項核對，差 0.2 mm（模擬值）就可能壓壞模具。
