  criteria: 首件成形高度與壓印深度在公差 ±0.05 mm（模擬值）內、沖壓力峰值在設定值 ±5%（模擬值）內、左右沖壓力平衡正常，即排除閉模高度設定錯誤；若閉模高度讀值與模具資料相差 0.2 mm 以上（模擬值），或首件尺寸明顯不足／過深，改懷疑閉模高度設定錯誤（SOP-STP-023）。
