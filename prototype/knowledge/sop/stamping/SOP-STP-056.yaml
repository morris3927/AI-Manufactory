verify:
- 以寸動方式全程上下行數次，聽音並觀察滑塊運動是否平順，同時讀取主馬達電流；判定：無異音、滑塊無頓挫；主馬達電流比對留到試沖時確認（寸動時的電流不具代表性）
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 無料空運轉連續往復 10 次（模擬值），觀察平衡缸壓力持壓情形；判定：10 分鐘（模擬值）內壓降不超過 0.1 bar（模擬值），且壓力讀值與模具資料對應值相差不超過 0.1 bar（模擬值）。
- 試沖 5 件（模擬值），比對首件與末件尺寸，並確認停止角度；判定：成形高度與壓印深度在 ±0.05 mm（模擬值）內、首末件差異在 0.03 mm（模擬值）內、停止角度未超限且無異音；主馬達電流在上行段與下行段較換模前基準差異在 5%（模擬值）以內，方可結案
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 調整後壓力仍無法穩定持壓，或 10 分鐘內壓降超過 0.1 bar（模擬值） → 通知設備工程師／原廠技師
- 停止角度超限、停止時間超過 230 ms（模擬值）或數日內持續變大 → 改走 SOP-STP-051
- 氣源總壓持續低於 4.8 bar（模擬值），或同一供氣管路多台機台同時壓降 → 改走 SOP-STP-055
lessons: 換模不是只有換模具，平衡缸壓力要跟著上模重量一起改；壓力不對，軸承與連桿都在替你買單。
