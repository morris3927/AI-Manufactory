  criteria: 停止角度在設定上限內，且近數日紀錄無持續增加趨勢，即排除離合器／制動器磨耗；若停止角度超限、停止時間超過 230 ms（模擬值），或數日內持續變大，改懷疑離合器／制動器磨耗（SOP-STP-051）。
