  criteria: 平衡缸壓力與模具資料不符、主馬達電流呈階梯式上升（上行或下行段較換模前基準上升 8% 以上，模擬值）、且氣源總壓維持正常，三項同時成立即判定為本模式。若氣源總壓低於 4.8 bar（模擬值），或同一供氣管路多台機台同時壓降，改懷疑氣源壓力不足（SOP-STP-055）。
