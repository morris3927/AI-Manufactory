  criteria: 壓力錶讀值與模具資料對應值相差 0.3 bar 以上（模擬值）即判定為本模式；相差小於 0.3 bar（模擬值）則排除本模式，改查其他原因。氣源總壓須在 5.5～6.0 bar（模擬值）之間；若總壓低於 4.8 bar（模擬值），先改懷疑氣源壓力不足。
