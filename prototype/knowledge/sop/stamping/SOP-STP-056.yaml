symptoms:
- 換模後異音
- 主馬達電流上升
- 停止角度變化
- 滑塊運動不順
- 換模後滑塊上下行出現異音，聲音來自上方平衡缸或連桿區
- 主馬達電流上升，上行段或下行段電流明顯比換模前高
- 滑塊運動不順、有頓挫感，寸動時特別明顯
- 停止角度變化，滑塊停的位置跟以前不一樣
- 平衡缸壓力錶讀值與模具資料的上模重量對應值對不上
