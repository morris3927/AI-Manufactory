verify:
- 確認感測器接頭已插緊、纜線固定妥當、感應面清潔，且固定夾未妨礙料帶；判定：接頭無鬆動、感應面無油屑、纜線無磨破；若仍有鬆動或油屑，不得進入試運轉。
- 需要通電量測或移動滑塊時，依 LOTO-FEED-01 測試／定位程序：需要通電量測送料長度時：清除人員、由原上鎖人取下自己的鎖、現場主管在場；只用寸動或送料機單獨試送（料帶不進模），手不得進入滾輪夾捲點；量劃線長度時送料機須停止；量測完成後重新上鎖並驗證零能量
- 由原上鎖人暫時解除上鎖、主管在場，只用寸動讓送料機送料數個步距，觀察 MISFEED 訊號與送料長度；判定：連續 10 次（模擬值）寸動送料，MISFEED 不得誤觸發；送料長度誤差維持在 ±0.03 mm（模擬值）以內。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 在主管在場下以寸動進行料帶試沖 5 次（模擬值），確認警報不再間歇出現，並檢查製品與模面；判定：試沖 5 次（模擬值）無 MISFEED 誤報，製品無凹痕、模面無廢料；若仍反覆觸發，依 escalate_if 處置。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清潔感應面、重新插緊接頭並固定纜線後，同一感測器仍在一班內反覆觸發 → 通知設備工程師／原廠技師（更換感測器並檢查輸入模組）。
- 送料長度誤差在 5～15 分鐘內逐步累積（模擬值），或滾輪表面有亮帶、料帶有滑痕 → 改走 SOP-STP-012。
- 模面或製品可撿到廢料、模具保護間歇觸發，或沖速提高後 MISFEED 更常出現 → 改走 SOP-STP-031。
lessons: 誤送料偵測器反覆跳時，先查接頭、纜線與感應面，不要用重置當維修；每次重置前先確認送料長度與模面狀況。
