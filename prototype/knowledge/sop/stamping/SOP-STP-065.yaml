verify:
- 以同厚度試片模擬廢料投入滑道 3 次（模擬值），確認可順利落入集料箱；判定：試片應在 5 秒內（模擬值）落入集料箱，滑道與落料孔不得回堆；若試片停滯或回堵，重新檢查導板間隙與滑道變形。
- 以寸動方式運轉廢料輸送帶，確認電流、聲音與運轉狀態；判定：輸送帶電流穩定在 1.0～1.4 A（模擬值），無異常音與偏移；若電流超過 2.0 A（模擬值）或再次堵塞，停止並回查輸送帶張力與滑道。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動方式試沖 5 次（模擬值），觀察模具保護、沖壓力峰值與落料孔排出狀況；判定：模具保護不動作，沖壓力峰值低於過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值），落料孔無廢料回堆；若重複觸發 DIE_PROTECT，改查 slug_pulling（SOP-STP-031）或 overload_tonnage（SOP-STP-053）。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清除堵塞後 24 小時內（模擬值）同一滑道再次堵塞 → 改走 SOP-STP-033 檢查刃口／沖頭磨耗，並通知設備工程師。
- 落料孔反覆回堵且伴隨毛邊變大 → 改走 SOP-STP-033；若沖壓力峰值單次超過過負荷設定值（模擬值） → 改走 SOP-STP-053。
- 輸送帶電流持續超過 2.0 A（模擬值），或減速機有異音、軸承過熱 → 通知設備工程師／原廠技師。
lessons: 廢料排出不順不要只清一次就走，滑道變形、導板間隙與輸送帶張力沒處理，下一次堵塞會把廢料回堆到模仁，變成模具保護停機甚至模具損傷。
