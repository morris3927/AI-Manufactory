- 'no': 5
  phase: inspect
  action: 在能源隔離狀態下，檢視換模後首批料帶與製品，標記單側毛邊、導正孔壓痕與卡料位置，並確認是否集中在同一側。
  criteria: 若同一側連續出現單側毛邊高度超過 0.08 mm（模擬值）、另一側正常，且導正孔壓痕僅在單側，判定為本模式；若毛邊高度隨沖次逐步增加、左右沖壓力平衡正常且與換模無關，改懷疑 punch_edge_wear（SOP-STP-033）。
  caution: 料帶邊緣可能割手，搬運時須戴防割手套。
