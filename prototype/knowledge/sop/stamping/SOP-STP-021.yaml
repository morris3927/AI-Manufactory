  criteria: 若閉模高度差值在 0.05 mm（模擬值）以內，但左右沖壓力差超過 10%（模擬值），支持本模式；若閉模高度差值超過 0.2 mm（模擬值），或首件成形高度／壓印深度不足或過深，改懷疑 shut_height_misset（SOP-STP-023）。
