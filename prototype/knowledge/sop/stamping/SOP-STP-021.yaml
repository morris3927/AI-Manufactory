- 'no': 7
  phase: inspect
  action: 目視與手動檢查模具定位銷、定位銷襯套、定位面有無單側磨亮、鬆動、異物或壓痕；以厚薄規量測定位銷與襯套單邊間隙。
  criteria: 若定位銷單側磨亮、襯套單邊間隙超過 0.08 mm（模擬值）或定位面有壓痕，判定為本模式；若定位銷與襯套正常，但料帶持續往同一側偏、越往模具後段偏移越大且送料長度誤差沒有明顯變化，改懷疑 coil_camber（SOP-STP-009）。
  caution: 模具內彈簧與氮氣彈簧可能仍有預壓，不可直接敲擊或拆卸。
  requires_supervisor: false
  requires_energized: false
  ref:
