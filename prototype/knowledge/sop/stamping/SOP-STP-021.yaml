- 'no': 8
  phase: inspect
  action: 需要通電量測或移動滑塊時，依 LOTO-PRESS-SERVO-01 測試／定位程序：清除危險區內工具與人員；滑塊需要移動時先撤出安全塊；由原上鎖人取下自己的鎖，現場主管在場；只用寸動模式操作（第70條），完成後立即停機；重新上鎖、放回安全塊並驗證零能量後，才能再把手伸入上下模之間
  caution: 通電期間手不得進入模具區或滾輪夾捲點；測試／定位只限寸動調整與讀值，不得用來試沖或連續生產
  requires_supervisor: true
