- 'no': 9
  phase: inspect
  action: 由原上鎖人暫時解除、主管在場，以寸動試沖一次（有料），讀取左右沖壓力平衡值，並觀察導正銷進入導正孔時有無單側干涉
  criteria: 若左右沖壓力差超過 10%（模擬值），且閉模高度讀值與模具資料相符，判定為本模式；若壓力峰值異常高或低但左右平衡，改懷疑 shut_height_misset（SOP-STP-023）；若壓力峰值在數日到數週內緩慢上升 3～8%（模擬值）且毛邊隨沖次增加，改懷疑 punch_edge_wear（SOP-STP-033）。
  caution: 只可用寸動，確認模具內無工具與人員後再動作；無料空打讀不到沖壓力，比對左右平衡必須有料
  requires_supervisor: false
