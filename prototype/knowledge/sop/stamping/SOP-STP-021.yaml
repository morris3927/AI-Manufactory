symptoms:
- 單側毛邊
- 異音
- 換模後卡料
- 導正孔單側壓痕
- 左右沖壓力不平衡
- 換模後第一批就出現單側毛邊，另一側正常。
- 導正孔只有單邊有壓痕，料帶會卡在導正銷。
- 沖起來有異音，左右噸位表差很多。
- 換模後一直卡料，而且都卡同一邊。
- 閉模高度看起來跟模具資料差不多，但製品就是偏一邊。
