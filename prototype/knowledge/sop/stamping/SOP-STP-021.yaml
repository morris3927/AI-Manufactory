verify:
- 手動確認定位銷插入與拔出順暢，無單側卡澀；以厚薄規量測定位銷與襯套單邊間隙；判定：若單邊間隙不超過 0.05 mm（模擬值）且手動滑順，通過；若仍單側卡澀或間隙超過 0.05 mm（模擬值），重新檢查定位面與襯套。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動進行試沖，檢查首批 5 件（模擬值）之導正孔壓痕、單側毛邊與左右沖壓力差；判定：若左右沖壓力差在 10%（模擬值）以內、毛邊高度不超過 0.08 mm（模擬值）且左右差 0.03 mm 以內（模擬值）、導正孔無單側壓痕，判定修復完成；若壓力差仍超過 10%（模擬值）且閉模高度相符，通知設備工程師／原廠技師或改走 SOP-STP-033。
- 連續生產 30 件（模擬值），確認無卡料、無異常異音，且料帶無持續單側偏移；判定：30 件（模擬值）內無卡料、無異常異音、料帶無持續單側偏移，判定穩定；若料帶仍往同一側偏且越後段越大，改走 SOP-STP-009。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換定位銷與襯套後，左右沖壓力差仍超過 10%（模擬值）且閉模高度讀值與模具資料相符 → 通知設備工程師／原廠技師。
- 定位銷孔磨耗超過 0.10 mm（模擬值）或襯套座鬆動無法以更換襯套回復 → 通知設備工程師／原廠技師。
- 料帶持續往同一側偏移、越往模具後段偏移越大且送料長度誤差沒有明顯變化 → 改走 SOP-STP-009。
lessons: 換模後首批不要只看尺寸，單側毛邊與導正孔單側壓痕就是模具定位偏移的早期訊號，先量定位銷間隙再調壓力。
