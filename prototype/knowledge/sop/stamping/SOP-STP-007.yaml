verify:
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以單動（一行程一停止）試沖 5 次（模擬值），量測噸位峰值與送料長度；判定：噸位峰值與換料前基準差異在 ±3% 以內（模擬值），送料長度誤差在 ±0.10 mm 以內（模擬值），且無 MISFEED 警報 → 判定合格。
- 恢復連續生產並觀察 30 分鐘（模擬值），記錄噸位峰值、成形高度、毛邊與跳屑狀況；判定：30 分鐘內無卡料，成形高度在 ±0.05 mm 以內（模擬值），毛邊無異常增大、無跳屑，噸位峰值維持穩定且無階躍變化 → 判定合格。
- 【現場經驗（模擬）】將料捲批號、料厚與硬度量測值、噸位峰值、送料長度與處置內容回填維修紀錄，並通知品保追蹤同批號的其他料捲；判定：紀錄完整可追溯，且同一批號未再出現重複異常；若同一批號多捲重現，須標記並進入升級處置。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內異常解鎖程序由主管處理；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換合格料捲後噸位峰值仍出現 5% 以上階躍（模擬值），且送料長度誤差持續 → 改走 SOP-STP-063，或通知設備工程師／原廠技師。
- 同一批號多捲料厚實測超差且重複發生 → 通知設備工程師／原廠技師，並將該批料捲隔離退運。
- 噸位峰值超過機台額定或出現 OVERLOAD 警報 → 改走 SOP-STP-053，並通知設備工程師／原廠技師。
lessons: 換料後才出現的異常，先量料厚與硬度、再比對噸位階躍；不要一開始就調模具或加大噸位，否則會把料捲問題變成模具問題。
