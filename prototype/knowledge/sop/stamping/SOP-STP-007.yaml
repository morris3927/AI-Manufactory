symptoms:
- 換料後卡料
- 沖壓力突然變大或變小
- 成形高度不穩
- 回彈變大
- 同一捲重複異常
- 換料捲後半小時內開始卡料，換回前一捲就恢復正常
- 沖壓力突然變大或變小，噸位峰值一次跳上去後就停在新水位
- 成形高度不穩、回彈變大，尺寸忽大忽小
- 同一捲料反覆出問題，其他料捲卻正常
- 送料長度突然偏長或偏短（步距跑掉、pitch 跑掉），不是慢慢累積
