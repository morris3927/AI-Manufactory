  criteria: 若只在特定料捲發生、換回前一捲即恢復，且送料長度誤差維持在 ±0.10 mm（模擬值）內，判定為本模式；若換料捲後 30 分鐘（模擬值）內沖壓力峰值出現一次 5% 以上（模擬值）階躍並維持，改懷疑 material_thickness_dev（SOP-STP-007）；若換模後首批即出現左右沖壓力差超過 10%（模擬值），改懷疑 die_misalignment（SOP-STP-021）。
