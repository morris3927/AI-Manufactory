verify:
- 重新穿料後，取 1 m（模擬值）料帶放平於平台，量測最大側彎量，並以塞尺量測料帶邊緣與兩側導板之間隙；判定：側彎量小於 0.5 mm/m（模擬值），且兩側間隙合計 0.5～1.0 mm（模擬值）、任一側不得為零，判定合格；若仍大於 1.5 mm/m（模擬值），回到 repair 重新對中。
- 以寸動送料 10 步（模擬值），觀察料帶在側導板間的位置與 STRIP_EDGE 觸發情形；判定：無 STRIP_EDGE 觸發，料帶單側偏移小於 0.3 mm（模擬值），送料長度誤差在 ±0.10 mm（模擬值）內。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以寸動試沖 5 件（模擬值），檢查後段工站卡料、毛邊與導正孔壓痕，並比對沖壓力峰值；判定：連續 5 件（模擬值）無卡料、無單側毛邊、導正孔無單側壓痕，沖壓力峰值變動小於 5%（模擬值）。
restore:
- 依 LOTO-FEED-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 重新對中、清潔整平輥與調整側導板後，側彎量仍超過 1.5 mm/m（模擬值）→ 通知設備工程師／原廠技師。
- 換料捲後 30 分鐘（模擬值）內沖壓力峰值出現 5% 以上（模擬值）階躍並維持 → 改走 SOP-STP-007。
- 整平輥壓下量與該料厚設定表不符，或料帶進模前仍有翹頭／弓形 → 改走 SOP-STP-063。
lessons: 料帶側彎先確認「是不是只跟著某一捲跑」，不要一開始就調模具；對中、整平與側導板沒做好，後段一定卡料。
