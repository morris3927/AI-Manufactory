verify:
- 穩壓 5 分鐘（模擬值）後，讀取總壓與支管壓力；判定：總壓維持 4.8 bar（模擬值）以上，支管壓降不超過 0.2 bar（模擬值），無 AIR_LOW。
- 以寸動確認離合器結合、滑塊動作正常，並聽有無漏氣聲；判定：寸動 3 次（模擬值）動作正常、無 AIR_LOW、無漏氣聲；停止角度留到下一步單動試沖時讀取
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 連續試沖 5 次（模擬值），觀察氣壓與同管路其他機台；判定：氣壓維持 4.8 bar（模擬值）以上，同管路其他機台無同時壓降，AIR_LOW 未再出現，停止角度監視器讀值在設定上限內；停止角度仍超限 → 改走 SOP-STP-051（離合器／制動器屬安全裝置，交合格人員）；壓降重現 → 通知設備工程師／原廠技師
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 氣壓恢復至 4.8 bar（模擬值）以上後，停止角度仍超過設定上限 5%（模擬值）或停止時間持續增加 → 改走 SOP-STP-051。
- 氣源總壓正常，但平衡缸壓力與模具資料的上模重量對應值差 0.3 bar（模擬值）以上，且主馬達電流上升 10%（模擬值） → 改走 SOP-STP-056。
- 同管路多台同時壓降且無法於現場找到局部洩漏，或空壓機／乾燥機／儲氣筒異常 → 通知設備工程師／原廠技師。
lessons: 先看別台有沒有一起掉壓，再決定拆接頭；共用管路問題不是單機修理就能結案。
