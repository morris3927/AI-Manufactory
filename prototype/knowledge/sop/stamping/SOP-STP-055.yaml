symptoms:
- 氣壓低警報
- 離合器結合不良
- 行程變慢
- 多台同時停機
- 氣壓低警報（AIR_LOW）亮起，機台停機。
- 離合器結合不良，滑塊起動無力或行程變慢。
- 同一條供氣管路的多台機台一起停機。
- 停止角度變大，但氣壓恢復後又回到正常。
- 現場說「機台沒氣、行程軟軟的」。
