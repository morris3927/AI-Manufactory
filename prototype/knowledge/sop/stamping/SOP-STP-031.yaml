verify:
- 在主管在場、僅使用寸動之條件下，寸動滑塊上下 3 次（模擬值），觀察沖頭回程有無帶料；判定：3 次寸動（模擬值）均無廢料吸附或上跳，脫料板動作平順，判定初步正常。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以生產速度一半以下（模擬值）低速試沖 20 模（模擬值），檢查製品與模面；判定：20 模內（模擬值）無壓痕、無廢料附著，DIE_PROTECT 未觸發。
- 逐步提高至生產速度，每階提高 10 SPM（模擬值），每階試沖 50 模（模擬值）；於目標速度連續試沖 200 模（模擬值）；判定：目標速度連續 200 模（模擬值）無壓痕、無廢料上跳、無 DIE_PROTECT 間歇觸發，判定修復完成；若提速後重現，依 escalate_if 處理。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清潔與更換沖頭後，提速至目標 SPM 仍反覆出現廢料上跳 → 改走 SOP-STP-033（刃口／沖頭磨耗）並通知模具技師。
- 檢查發現廢料堆積在落料孔或廢料滑道、輸送帶電流升高或停止 → 改走 SOP-STP-065（廢料排出堵塞）。
- 脫料板回彈不足或料帶被帶起，且降速無明顯改善 → 改走 SOP-STP-036（脫料板彈簧疲勞）。
lessons: 跳屑多半不是模具保護壞，而是沖頭端面黏料或防跳屑設計不足；先找廢料來源，再談提速。
