verify:
- 需要通電量測或移動滑塊時，依 LOTO-PRESS-SERVO-01 測試／定位程序：清除危險區內工具與人員；滑塊需要移動時先撤出安全塊；由原上鎖人取下自己的鎖，現場主管在場；只用寸動模式操作（第70條），完成後立即停機；重新上鎖、放回安全塊並驗證零能量後，才能再把手伸入上下模之間
- 以寸動將滑塊移至上死點，觀察脫料板回彈是否平順、有無異音或卡滯；判定：脫料板應均勻回彈，四角高度差小於 0.10 mm（模擬值）；若仍歪斜或卡滯，停止試沖並重新檢查彈簧與脫料板固定螺栓。
- 試沖與連續生產屬於恢復生產，不是測試／定位：先清點工具、撤出安全塊、恢復護圍、光幕與所有安全裝置並確認功能正常、確認人員離開危險區與滾輪夾捲點；由原上鎖人取下自己的鎖（連動上鎖的送料機／沖床一併確認）後，才由操作員以正常操作模式（單動、光幕與雙手操作有效）試沖。試沖中發現異常，須重新依 LOTO 上鎖後才能再進入模區或滾輪夾捲點
- 以最低速 10 SPM（模擬值）試沖料帶 20 次（模擬值），觀察料帶是否被帶起、有無 STRIP_LIFT 警報及製品變形；判定：連續 20 次（模擬值）試沖中，料帶上浮偵測未觸發、料帶無被帶起且製品無變形，判定修復；若仍間歇觸發 STRIP_LIFT，改查 slug_pulling（SOP-STP-031）或 die_lubrication_insufficient（SOP-STP-035）。
- 以正常生產速度之 70%（模擬值）連續沖 100 次（模擬值），抽檢製品 5 件（模擬值），確認無帶料、無變形、無異常毛邊；判定：100 次（模擬值）內無 STRIP_LIFT、無料帶變形，且抽檢製品尺寸在公差內，判定合格；若降速後仍發生，通知設備工程師／原廠技師或改走 SOP-STP-031／SOP-STP-035。
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序（連動上鎖的送料機／沖床依各自檢查表一併解除）：清點工具、恢復護圍與光幕、取出安全塊、確認人員離開後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；原上鎖人不在場時不得由他人剪鎖或代取，依廠內書面異常解鎖程序由主管處理（同條 (e)(3) 例外規定）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換彈簧後手動壓縮仍卡滯，或脫料板四角高度差仍超過 0.30 mm（模擬值） → 通知設備工程師／原廠技師，並改走 SOP-STP-021 檢查模具定位偏移。
- 試沖時仍間歇出現 STRIP_LIFT，且模面或製品上可撿到廢料 → 改走 SOP-STP-031（廢料上跳）。
- 成形面出現拉痕、黏模或噴油次數下降 → 改走 SOP-STP-035（模具潤滑不足）。
lessons: 脫料板彈簧不要等到斷裂才換，四角高度差與累積沖次一起看，才不會把帶料誤判成跳屑或潤滑不足。
