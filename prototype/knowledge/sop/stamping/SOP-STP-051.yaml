symptoms:
- 滑塊停止位置偏移
- 停止角度超限警報
- 制動異音
- 停止時間變長
- 寸動時滑塊滑行
prerequisites:
  tools:
  - Kanban 工單
  - 「安全裝置異常・禁止使用」標籤
  - 個人鎖與標籤
  parts: []
  skill_level: 現場主管／合格人員
steps:
- 'no': 1
  phase: prepare
  action: 立即停止生產：滑塊已停止時保持停止；若滑塊無法在正常位置停止，按緊急停止。不得重置停止角度超限警報後繼續生產
  caution: 停止角度超限代表滑塊可能無法在設計位置停止，任何人不得把手伸入模具區
  requires_supervisor: false
  requires_energized: false
  ref:
  - REG-N0060034-38
  - REG-N0060034-20
- 'no': 2
  phase: prepare
  action: 所有人員離開危險區；通知現場主管與設備工程師，在 Kanban 標記「安全裝置異常」並記錄停止角度、停止時間與氣源壓力讀值
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060001-18
- 'no': 3
  phase: isolate
  action: 由現場主管指派人員依 LOTO-PRESS-MECH-01（機械沖床） 或 LOTO-PRESS-SERVO-01（伺服沖床）執行停機、隔離、上鎖掛牌、洩除殘能並驗證零能量；送料機依各檢查表的送料線隔離點連動上鎖（兩台都要上鎖，不是擇一），並在操作盤掛「安全裝置異常・禁止使用」標籤
  caution: 制動器異常時滑塊可能自行下滑：任何人身體不得進入滑塊下方；安全塊由合格人員在主電源隔離、飛輪完全停止後放入，平衡缸與制動器氣源要等安全塊放妥後才洩壓（先洩壓會讓滑塊重量全壓在可疑的制動器上）
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060009-57-p1
  - REG-N0060009-69
  - REG-OSHA-1910.147-d-4
- 'no': 4
  phase: inspect
  action: 等待合格人員（設備工程師或原廠技師）依職業安全衛生管理辦法第26條（離合器及制動裝置、一行程一停止機構及緊急制動器）與機械設備器具安全標準第35、38條（氣壓離合器式曲軸沖床的彈簧緊固型制動器、超限運轉監視裝置）進行檢查。一般技術員不得自行調整離合器、制動器或停止角度監視器；AI 不提供排除方法
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060027-26
  - REG-N0060034-35
  - REG-N0060034-38
- 'no': 5
  phase: verify
  action: 合格人員完成檢查並留下紀錄（管理辦法第80條，保存三年）；現場主管確認停止角度與停止時間量測回到設定範圍內後，才在 Kanban 簽核
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060027-80
- 'no': 6
  phase: restore
  action: 依 LOTO-PRESS-SERVO-01 解除程序，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；AI 不得宣告可以復電
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060009-254-p2
  - REG-OSHA-1910.147-e-3
verify:
- 合格人員完成檢查並留下紀錄（管理辦法第80條，保存三年）；現場主管確認停止角度與停止時間量測回到設定範圍內後，才在 Kanban 簽核
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；AI 不得宣告可以復電
escalate_if:
- 停止角度超限時有人員在危險區或已有人受傷 → 依 S3 處理：急救優先、保全現場，協助主管於 8 小時內通報（職安法第37條）
- 氣源壓力同時低於下限 → 由主管確認後另開 SOP-STP-055 工單（氣源壓力不足），但離合器／制動器檢查仍須由合格人員完成
- 停止角度在數日內持續增加 → 通知設備工程師／原廠技師安排離合器與制動器定期檢查（管理辦法第26條）
lessons: 安全裝置異常只做停機、通知、上鎖與記錄，排除交給合格人員。
