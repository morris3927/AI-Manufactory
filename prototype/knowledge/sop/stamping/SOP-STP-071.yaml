symptoms:
- 無法起動
- 頻繁誤遮斷
- 光幕停用中有人在危險區
- 光幕自我診斷錯誤無法起動
- 頻繁誤遮斷停機
prerequisites:
  tools:
  - Kanban 工單
  - 「安全裝置異常・禁止使用」標籤
  - 個人鎖與標籤
  parts: []
  skill_level: 現場主管／合格人員
steps:
- 'no': 1
  phase: prepare
  action: 機台保持停止；不得嘗試重置、遮蔽、移動或調整光幕，也不得改用其他操作模式繼續生產
  caution: 光幕屬法定安全裝置（機械設備器具安全標準第11條之1、第12條），AI 不提供任何排除方法
  requires_supervisor: false
  requires_energized: false
  ref:
  - REG-N0060034-11-1
  - REG-N0060034-12-p1
- 'no': 2
  phase: prepare
  action: 若影像偵測到有人在光幕停用狀態下位於危險區：立即請人員退出危險區至安全位置（職安法第18條），並通知現場主管
  caution: 以人員安全為優先，先退避再處理機台
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060001-18
- 'no': 3
  phase: isolate
  action: 由現場主管指派人員依 LOTO-PRESS-SERVO-01（伺服沖床） 或 LOTO-PRESS-MECH-01（機械沖床）執行停機、隔離、上鎖掛牌、洩除殘能並驗證零能量；送料機依各檢查表的送料線隔離點連動上鎖（兩台都要上鎖，不是擇一），並在操作盤掛「安全裝置異常・禁止使用」標籤
  caution: 合格人員需在上下模之間作業時，須先放入安全塊（設施規則第69條）
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060009-57-p1
  - REG-N0060009-69
  - REG-OSHA-1910.147-d-4
- 'no': 4
  phase: inspect
  action: 交由現場主管與合格人員（電氣合格人員或原廠技師）確認光幕狀態、自我診斷結果與停用原因；一般技術員與 AI 只負責記錄時間、畫面與狀態，不做排除
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060034-4
  - REG-N0060034-6
- 'no': 5
  phase: verify
  action: 合格人員完成檢修後，以測試棒遮光確認滑塊會停止，並留下紀錄；若屬人為停用，由主管了解原因並記錄（究責不究罰），確認後在 Kanban 簽核
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-N0060034-12-p1
  - REG-N0060027-59
- 'no': 6
  phase: restore
  action: 依 LOTO-PRESS-SERVO-01 解除程序，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞（設施規則第254條第2項）；AI 不得宣告可以復電
  caution: null
  requires_supervisor: true
  requires_energized: false
  ref:
  - REG-OSHA-1910.147-e-3
  - REG-N0060009-254-p2
verify:
- 合格人員完成檢修後，以測試棒遮光確認滑塊會停止，並留下紀錄；若屬人為停用，由主管了解原因並記錄（究責不究罰），確認後在 Kanban 簽核
restore:
- 依 LOTO-PRESS-SERVO-01 解除程序，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞（設施規則第254條第2項）；AI 不得宣告可以復電
escalate_if:
- 光幕停用狀態下偵測到人員在危險區 → 依 S3 處理，主管到場並保全影像紀錄
- 有人員受傷 → 急救優先、保全現場，協助主管於 8 小時內通報（職安法第37條）
- 同一光幕一週內重複異常 → 通知設備工程師／原廠技師安排檢查
lessons: 安全裝置異常只做停機、通知、上鎖與記錄，排除交給合格人員。
