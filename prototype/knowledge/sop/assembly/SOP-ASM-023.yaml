  criteria: 若計數少於工單要求且影像檢出缺孔、已完成鎖附紀錄皆為 OK、無 FEEDER_TIMEOUT，則支持本模式；若出現 FEEDER_TIMEOUT 或吸附失敗，改懷疑 screw_feeder_jam。
  caution: 不得關閉鎖附計數或防錯功能來比對；應保留原始紀錄。
