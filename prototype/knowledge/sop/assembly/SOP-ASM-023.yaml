  criteria: 若找到 1 孔（模擬值）以上缺螺絲且孔內無斷頭或異物，判定為漏鎖可疑件；若孔內有歪斜螺絲、異物或送釘軌道卡料，改懷疑 screw_feeder_jam 或斜牙。
  caution: 機殼鈑金銳邊可能割傷，應戴防割手套並避免手指深入孔位。
