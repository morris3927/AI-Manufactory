  phase: inspect
  action: 專門區分送釘機卡釘：檢查送釘機軌道、分離器、吸嘴與起子端有無歪斜螺絲、異物或規格不同螺絲，並確認有無 FEEDER_TIMEOUT 或吸附失敗紀錄。（現場經驗（模擬））
  criteria: 若送釘機無逾時、軌道與分離器無卡料、起子端供釘正常且已鎖螺絲扭力與角度正常，判定本模式漏鎖；若軌道或分離器卡著歪斜螺絲、異物、規格不同螺絲，或出現 FEEDER_TIMEOUT、吸附失敗，改懷疑 screw_feeder_jam，走 SOP-ASM-021。
  caution: 不可通氣轉動振動盤，也不可將手伸入送釘軌道或分離器。
