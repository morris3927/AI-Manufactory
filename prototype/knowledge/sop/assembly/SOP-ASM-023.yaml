symptoms:
- 少鎖一顆
- 孔位沒有螺絲
- 鎖附數量不符
- 重工後漏鎖
- 交接班後漏打
- 少鎖一顆，工單要求數量對不上。
- 孔位沒有螺絲，目視或影像檢出缺孔。
- 鎖附數量不符，控制器計數少於工單要求。
- 重工後漏鎖，重工完直接流入下一站。
- 交接班後漏打，換班後才發現少鎖。
