  caution: 本模式常發生在換線、補料、重工或交接班後，隔離前應先保留工單、鎖附計數與影像紀錄，並確認送釘機與起子控制器電源、氣源及扭力臂彈簧能量已隔離，避免補鎖後無法追溯。
