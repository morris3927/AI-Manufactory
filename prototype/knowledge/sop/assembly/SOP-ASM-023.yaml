verify:
- 執行首件確認：逐孔目視與影像確認數量等於工單要求，screw_count_actual 等於 screw_count_required，無 screw_missing 與 COUNT_MISMATCH；判定：首件所有工單孔位均有螺絲，鎖附計數等於要求數量，影像無缺孔，且控制器紀錄無 COUNT_MISMATCH。
- 使用扭力分析儀對首件或試片抽測 3 件（模擬值），確認目標扭力 0.8 N·m（模擬值）與角度曲線在原設定範圍內（模擬值）；判定：抽測值落在控制器原設定判定範圍內（模擬值），角度曲線無異常；若浮鎖或扭力未達，改走 SOP-ASM-011；若斜牙或滑牙，改走 SOP-ASM-012。
- 確認同批前後件抽查與追溯紀錄完成，隔離品已標示，影像與計數紀錄已保存；判定：同批抽查 5 件（模擬值）均無漏鎖且計數相符；若再有漏鎖，通知品保工程師並擴大追溯。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（參考 OSHA 1910.147(e)(3)）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若送釘機出現 FEEDER_TIMEOUT、吸附失敗，或軌道／分離器卡著歪斜螺絲、異物、規格不同螺絲 → 改走 SOP-ASM-021（送釘機卡釘）。
- 若補鎖前發現孔牙損傷、斜牙、滑牙或壓鉚螺母鬆動 → 改走 SOP-ASM-012（斜牙／滑牙）。
- 若同批多件漏鎖、鎖附計數與影像紀錄持續不一致，或防錯功能異常 → 通知品保工程師並隔離追溯；必要時通知設備工程師。
lessons: 作業中斷後不要只看已完成鎖附紀錄都是 OK，務必比對工單要求數量、鎖附計數與影像，並在補鎖後完成首件確認與追溯。
