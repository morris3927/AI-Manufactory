verify:
- 修復後第一件執行首件確認：依作業指導書與檢驗表檢查走線路徑、護線套、束帶、連接器卡扣與外觀；判定：走線與指導書一致；最小彎曲半徑 ≥ 線束外徑 3 倍（模擬值）；無夾線、壓痕、破皮；束帶無勒痕；連接器卡扣扣上且無可見間隙。任一項不符即回修。
- 執行裝置偵測與絕緣測試，連續確認 3 次（模擬值）；判定：3 次（模擬值）裝置偵測均成功，無 LINK_INTERMITTENT；絕緣電阻 ≥ 100 MΩ（模擬值），HIPOT 通過。若仍 HIPOT_FAIL、時好時壞或 < 10 MΩ（模擬值），回修並通知品保工程師。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（參考 OSHA 1910.147(e)(3)）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 目視發現連接器卡扣未扣、公母端有可見間隙，且功能測試每次偵測不到裝置 → 改走 SOP-ASM-042（連接器未插到位）。
- 線束破皮已露出導體、絕緣電阻 < 10 MΩ（模擬值）或 HIPOT_FAIL 重現 → 通知品保工程師並隔離該批工件，必要時通知設備工程師。
- 同一走線位置重複出現夾線，或作業指導書路徑與護線設計不足 → 通知設備工程師／品保工程師評估治具與指導書。
lessons: 蓋合前多看一眼線有沒有在護線套內、有沒有被上蓋壓到，比事後拆蓋重做更省時。
