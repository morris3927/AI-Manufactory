symptoms:
- 夾線
- 線被上蓋壓到
- 走線不對
- 線材破皮
- 測試時好時壞
- 上蓋蓋合時有阻力，感覺壓到線。
- 開蓋看到線材有壓痕、破皮或貼在鈑金銳邊。
- 走線歪掉，沒有照作業指導書走，或護線套脫落。
- 功能測試時裝置一下抓到、一下抓不到。
- 絕緣測試不通過，或絕緣電阻偏低。
