  criteria: 看到線材被上蓋或支架夾住、有壓痕、絕緣破皮、線束貼著鈑金銳邊且無護線套，或路徑與指導書不符，即判定本模式；若線材外皮完好且路徑相符，先排除夾線與走線錯誤。若同時看到連接器卡扣未扣、公母端有可見間隙，改懷疑 connector_not_seated。
  caution: 開蓋時避免強行拉扯已夾住的線材，防止二次破皮。
