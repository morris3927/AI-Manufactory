  criteria: 裝置偵測應每次成功且無 LINK_INTERMITTENT；絕緣電阻 ≥ 10 MΩ（模擬值）且 HIPOT 通過。若出現 HIPOT_FAIL、LINK_INTERMITTENT 或絕緣電阻 < 10 MΩ（模擬值），判定本模式；若每次偵測不到且卡扣未扣，改走 SOP-ASM-042。
