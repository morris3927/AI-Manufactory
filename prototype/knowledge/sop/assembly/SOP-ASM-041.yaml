  criteria: 卡扣已扣上、公母端無可見間隙、線材外皮完好，代表連接器本身已到位；若卡扣未扣、有可見間隙，且功能測試每次偵測不到裝置，改懷疑 connector_not_seated（SOP-ASM-042）。若卡扣到位但線材有壓痕或走線異常，仍判定本模式。
