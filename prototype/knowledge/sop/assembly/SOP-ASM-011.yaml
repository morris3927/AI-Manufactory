symptoms:
- 浮鎖
- 螺絲沒鎖平
- 扭力不夠
- 起子提早停
- 補鎖就好了
- 浮鎖，螺絲頭與機殼之間有可見間隙。
- 螺絲沒鎖平，用手輕推可感覺鬆動。
- 扭力不夠，控制器判低扭力 NOK。
- 起子提早停，角度沒有轉完應有圈數。
- 現場常說補鎖就好了，且 NOK 分散在不同孔位。
