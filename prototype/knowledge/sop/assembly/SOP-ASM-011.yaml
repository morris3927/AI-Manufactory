verify:
- 修復後執行首件確認：由品保或指定人員對第一件機殼檢查所有鎖附點、螺絲頭貼平與外觀；判定：首件所有鎖附點最終扭力達 0.80 N·m（模擬值）且角度達 1080 度以上（模擬值），螺絲頭與工件間隙不大於 0.05 mm（模擬值），判定合格；若再出現低扭力 NOK，改走 SOP-ASM-031 由品保工程師複判。
- 以扭力分析儀對首件抽測 3 點（模擬值），確認實測值與設定值偏差；判定：抽測 3 點（模擬值）皆在 0.72～0.88 N·m（模擬值）且無浮鎖，判定合格；若偏差超過 ±10%（模擬值），改走 SOP-ASM-031 並由品保工程師複判。
- 下游功能測試站執行裝置偵測與絕緣測試，並檢查拆鎖後走線、連接器卡扣、束帶與護線套；判定：功能測試通過、絕緣測試合格、連接器卡扣到位、線材彎曲半徑與束帶／護線套無異常，判定修復完成；若功能測試異常，隔離該批並由品保工程師複判。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（設施規則第254條）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若同一孔位重複低扭力且孔牙有損傷、毛邊或被異物堵住 → 改走 SOP-ASM-012 並通知品保工程師。
- 若起子頭使用次數超過 40,000 次（模擬值）、刃口圓化或缺角，或試鎖有打滑聲 → 改走 SOP-ASM-013。
- 若扭力分析儀抽測偏差超過 ±10%（模擬值）或工具校正逾期 → 改走 SOP-ASM-031 並通知設備工程師。
lessons: 浮鎖先看間隙、角度與孔牙，再談補鎖；不要用放寬扭力或關閉計數來讓 NOK 變 OK。
