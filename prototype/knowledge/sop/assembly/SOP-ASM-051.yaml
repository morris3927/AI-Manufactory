- 班長確認後才恢復該站作業；AI 不得宣告可以恢復作業。本事件紀錄只用於改善防護具供應與作業設計，不得用於個人考核
escalate_if:
- 同一站一週內重複發生 → 班長與職安人員檢討防護具選型、尺寸與供應（設施規則第277條）
- 靜電手環測試站本身異常（多人同時不通過） → 通知品保工程師檢查測試站
- 有人被鈑金銳邊割傷 → 急救優先，通知主管並記錄
lessons: PPE 告警先問「有沒有發、合不合用」，再提醒個人；不懲罰、不做考核。
