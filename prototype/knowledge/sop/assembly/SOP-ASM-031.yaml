verify:
- 首件試鎖確認：使用校正合格起子，在試片或報廢件上試鎖 5 顆（模擬值）M3 螺絲，目標 0.8 N·m（模擬值）；以扭力分析儀抽測；判定：實測偏差須在 ±10%（模擬值）內，螺絲頭貼平壓鉚螺母，無浮鎖、滑牙、斜牙與打滑聲。
- 實機首件與下游確認：在正式首件機殼完成鎖附，抽測 3 孔（模擬值）鎖附扭力；下游功能測試站完成裝置偵測與絕緣測試；判定：抽測鎖附扭力須在 0.72 至 0.88 N·m（模擬值）內，鎖附結果 OK；下游功能測試無鬆脫或干涉異常。
- 記錄與放行：登錄工具編號、校正到期日、抽測值、首件結果與隔離品處置；判定：連續 3 批（模擬值）首件抽測正常後才結束品質觀察；記錄須可追溯至工具與批號。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（設施規則第254條）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若校正報告顯示工具偏差超過 ±10%（模擬值），且更換校正合格備品後抽測仍異常 → 通知設備工程師，並改走 SOP-ASM-011（扭力未達／浮鎖）檢查鎖附條件。
- 若鎖附時有起子頭跳出十字槽的打滑聲、十字槽磨花或起子頭使用次數超過 40,000 次（模擬值） → 改走 SOP-ASM-013（起子頭磨耗（打滑））。
- 若校正逾期期間的產品已流入下游功能測試站 → 通知品保工程師追溯隔離，必要時改走 SOP-ASM-011（扭力未達／浮鎖）複查。
lessons: 校正到期日不是紙上日期；抽測偏差與換工具比對才是現場判斷漂移的關鍵，發現不良先隔離追溯再修復。
