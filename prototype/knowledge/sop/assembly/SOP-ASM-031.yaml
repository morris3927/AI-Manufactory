symptoms:
- 校正過期
- 抽測扭力不準
- 顯示 OK 但拆檢扭力不對
- 離合器跳脫點跑掉
- 換工具就正常
- 工具校正標籤到期日已過，或控制器出現 CALIB_OVERDUE。
- 以扭力分析儀抽測時，實測扭力與設定值偏差超過 ±10%（模擬值）。
- 鎖附結果多半仍顯示 OK，但下游拆檢的鬆脫扭力偏低或偏高。
- 離合器式起子的跳脫點跑掉，手感與平常不同。
- 換一支校正合格的工具後抽測就正常。
