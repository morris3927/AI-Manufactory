symptoms:
- 測不到裝置
- 連接器沒插好
- 卡扣沒扣
- 重插就好
- 開機抓不到硬碟
- 功能測試顯示 DEVICE_NOT_FOUND，開機抓不到硬碟或裝置。
- 目視連接器卡扣沒扣上，公母端之間有可見間隙。
- 連接器鬆鬆的，輕拉本體就脫開或出現縫隙。
- 重插到卡扣扣上後就恢復；修復前每次測試都失敗，不是時有時無。
- 線材外皮看起來完好，絕緣測試正常。
