verify:
- 執行首件確認：目視與輕拉檢查修復後連接器，確認卡扣完全扣上、公母端無可見間隙，線材走線與固定符合作業指導書；判定：卡扣完全扣上；厚薄規量測公母端間隙不大於 0.2 mm（模擬值）；輕拉連接器本體位移不大於 0.5 mm（模擬值）且卡扣未脫開；束帶與護線套無壓迫線材。
- 需要通電量測、移動設備、試銲或試鎖時，依 LOTO-ASM-TOOL-01 測試／定位程序：需要通電試鎖、量測扭力或執行功能測試時：由原上鎖人取下自己的插頭鎖蓋並插回電源，班長知悉；只在治具上用試片或報廢件試鎖；手指不得放在起子頭與送釘吸嘴下方；完成後再拔插頭並套回插頭鎖蓋
- 在功能測試站執行裝置偵測測試；判定：連續 3 次（模擬值）測試皆偵測到裝置，無 DEVICE_NOT_FOUND；若仍偶發失敗或時好時壞，停止放行並改查 cable_pinch_misroute 或測試治具。
- 執行絕緣測試並檢查線材外觀；判定：絕緣電阻大於 100 MΩ（模擬值），線材外皮完好、無夾線壓痕；開機測試通過但絕緣異常或外觀有壓痕／破皮，改走 SOP-ASM-041。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（參考 OSHA 1910.147(e)(3)）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若卡扣斷裂、端子歪斜或連接器本體損傷 → 更換線束並通知品保工程師。
- 若同批連續 2 件（模擬值）出現連接器未插到位 → 通知品保工程師並追溯同批。
- 若絕緣電阻小於 100 MΩ（模擬值）、線材有夾痕／破皮或彎曲半徑不足 → 改走 SOP-ASM-041。
lessons: 連接器要握本體、對正防呆鍵插到卡扣聲，並目視無間隙；重插後仍須做首件與功能／絕緣驗證，不可只憑手感放行。
