  - A4
- 'no': 7
  phase: inspect
  action: 在隔離狀態下拆下送釘軌道出口護蓋或分離器護蓋，使用塑膠鑷子或專用夾具清除卡釘與異物，記錄卡釘數量、位置、螺絲頭型與長度；清除後檢查軌道內壁與分離器動作面有無毛邊、變形或磨耗。
  criteria: 清除後軌道與分離器內無歪斜、重疊螺絲或異物，動作面無超過 0.2 mm（模擬值）之毛邊或變形，判定卡釘已排除；若同一位置反覆卡釘 3 次（模擬值）以上，改通知設備工程師檢查軌道與分離器。
  caution: 清除卡釘時不可刮傷軌道內壁或分離器動作面；拆下零件應放零件盤，避免掉落壓鉚螺母孔牙。
  requires_supervisor: false
  requires_energized: false
  ref:
