- 'no': 8
  phase: inspect
  action: 抽檢送料盤與卡釘螺絲，使用游標卡尺量測長度、牙距與頭型，並比對工單 BOM 規格；同時核對工單要求鎖附次數與影像／鎖附計數紀錄，區分漏鎖與錯料／混料。
  criteria: 若卡釘螺絲長度與 BOM 標稱值差異在 0.2 mm（模擬值）以內、牙距差異在 0.05 mm（模擬值）以內且頭型相符，送料盤無混料，並有 FEEDER_TIMEOUT 或軌道卡釘事實，判定本模式；若量測長度或牙距超出上述公差，或送料盤可見不同頭型／長度螺絲，判定 wrong_screw_type；若螺絲規格相符、軌道無卡釘且無送釘逾時，但工單孔位缺鎖，改懷疑 missing_screw。
  caution: 量測前先將可疑螺絲批與受影響工件隔離並標示追溯，不可把抽檢後螺絲混回送料盤。
  requires_supervisor: false
