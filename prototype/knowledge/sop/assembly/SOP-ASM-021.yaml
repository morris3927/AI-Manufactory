- 'no': 10
  phase: repair
  action: 若分離器或軌道位置跑掉，使用專用治具與手動方式復位，確認送釘路徑對正吸嘴中心；調整後以手動送釘路徑檢查無干涉。
  caution: 不可修改安全相關參數或放寬扭力判定上下限；調整時不可讓彈簧或振動盤儲能突然釋放。
