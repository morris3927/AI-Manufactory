- 'no': 9
  phase: repair
  action: 清除送釘軌道、分離器與吸嘴內之卡釘、異物與金屬屑；檢查送釘管、吸嘴與分離器護蓋，若有變形、破裂或磨耗超過 0.3 mm（模擬值）則更換通用件。
  caution: 不可用尖銳工具刮傷軌道或吸嘴；更換零件前確認新件規格與原件相同，不可用不同孔徑吸嘴替代。
  requires_supervisor: false
  requires_energized: false
