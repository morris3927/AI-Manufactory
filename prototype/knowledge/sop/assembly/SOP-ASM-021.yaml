symptoms:
- 送釘機卡住
- 吸不到螺絲
- 送釘逾時
- 軌道卡釘
- 補料後一直卡
- 送釘機卡住，起子端等不到螺絲。
- 吸嘴吸不到螺絲，一直出現送釘逾時。
- 軌道卡釘，補料後特別容易發生。
- 送釘逾時警報一直跳，但已鎖上的螺絲扭力與角度看起來正常。
- 分離器那邊卡著歪斜的螺絲或異物，送釘不順。
