- 'no': 4
  phase: isolate
  action: 依 LOTO-ASM-TOOL-01 執行輕量上鎖：拔下起子控制器插頭並套上插頭鎖蓋（充電式起子取下電池）、關閉送釘機氣源並洩壓，掛上個人標籤；插頭保持在自己的專屬控制下，並按啟動鍵確認不動作
  caution: 拆送釘軌道或分離器護蓋前，須確認振動盤已完全停止且氣源球閥 V-A1 已關閉，避免殘壓或卡釘彈出。
