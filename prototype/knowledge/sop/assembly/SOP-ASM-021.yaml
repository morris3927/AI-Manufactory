verify:
- 需要通電量測、移動設備、試銲或試鎖時，依 LOTO-ASM-TOOL-01 測試／定位程序：需要通電試鎖、量測扭力或執行功能測試時：由原上鎖人取下自己的插頭鎖蓋並插回電源，班長知悉；只在治具上用試片或報廢件試鎖；手指不得放在起子頭與送釘吸嘴下方；完成後再拔插頭並套回插頭鎖蓋
- 以試片或報廢件試鎖 5 顆（模擬值）M3 螺絲，確認送釘機每次取釘成功、無 FEEDER_TIMEOUT，並以扭力分析儀確認鎖附扭力與角度；判定：連續 5 顆（模擬值）送釘與鎖附成功，無卡釘、無 FEEDER_TIMEOUT；扭力在 0.8 N·m（模擬值）±10%（模擬值），角度落在首件建立之正常範圍（模擬值）。
- 執行首件確認：在首件工件上依工單鎖附全部孔位，檢查有無漏鎖、浮鎖、斜牙、滑牙與 NOK_NO_SCREW，並核對鎖附計數與防錯結果；判定：首件孔位全數鎖附且鎖附計數與工單要求一致；無浮鎖、斜牙、滑牙或 NOK_NO_SCREW；扭力與角度紀錄正常。
- 確認送料盤與軌道無殘留卡釘、無混料，將可疑工件與螺絲批隔離標示追溯；連續取釘 20 次（模擬值）確認無失敗後，填寫維修與首件紀錄；判定：送料盤與軌道目視無卡釘、無異物；連續 20 次（模擬值）取釘無失敗；隔離標示與追溯紀錄完成。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（設施規則第254條）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若清除卡釘後 120 分鐘（模擬值）內同一位置重複卡釘 3 次（模擬值）以上 → 通知設備工程師檢查送釘軌道與分離器。
- 若卡釘螺絲量測長度、牙距或頭型與 BOM 不符，或送料盤可見混料 → 改走 SOP-ASM-022（錯料／混料）並通知品保工程師。
- 若軌道無卡釘、無 FEEDER_TIMEOUT，但工單孔位缺鎖 → 改走 SOP-ASM-023（漏鎖）。
lessons: 補料後先核對螺絲批規格與送料盤有無混料，再讓送釘機連續取釘；卡釘不可硬撬，先隔離可疑螺絲批與受影響工件並追溯。
