- 'no': 5
  phase: inspect
  action: 在已完成上鎖掛牌後，目視檢查送釘軌道、分離器、吸嘴與送料盤出口，確認是否有歪斜、重疊、異物或頭型／長度不同的螺絲卡住；同時核對最近一次補料紀錄與卡釘位置。
  criteria: 若軌道或分離器可見 1 顆（模擬值）以上歪斜、重疊螺絲，或異物尺寸超過 0.5 mm（模擬值），且吸嘴內無螺絲，判定為本模式；若軌道與吸嘴無卡釘，但工單孔位有缺鎖且無送釘逾時紀錄，改懷疑 missing_screw；若卡住螺絲的頭型或長度與送料盤內其他螺絲明顯不同，改懷疑 wrong_screw_type。
  caution: 拆護蓋或伸入軌道前，先確認振動盤已完全停止，避免卡釘彈出；不可用起子頭硬撬軌道。
  requires_supervisor: false
  requires_energized: false
  ref:
  - A5
- 'no': 6
  phase: inspect
  action: 查閱停機前已保存的控制器事件紀錄、鎖附報表與補料紀錄，確認是否出現 FEEDER_TIMEOUT、feeder_pick_fail_count 大於 10 次（模擬值）、screw_result 為 NOK_NO_SCREW，並核對已完成鎖附的扭力與角度紀錄。
  criteria: 若最近 120 分鐘（模擬值）內出現 FEEDER_TIMEOUT 且取釘失敗次數大於 10 次（模擬值），但已完成鎖附的扭力在 0.8 N·m（模擬值）±10%（模擬值）且角度落在首件建立之正常範圍（模擬值），支持本模式；若完全沒有送釘逾時或取釘失敗紀錄，僅孔位缺螺絲，改懷疑 missing_screw；若已完成鎖附的角度偏離首件正常範圍超過 15%（模擬值），改懷疑 wrong_screw_type。
  caution: null
  requires_supervisor: false
  requires_energized: false
  ref:
