verify:
- 執行首件確認：以 BOM 正確規格螺絲鎖附首件 5 孔（模擬值），記錄扭力與最終角度，並確認螺絲頭貼平、無浮鎖、無混料；判定：扭力達 0.8 N·m（模擬值）且最終角度落在 1080°（模擬值）至 1800°（模擬值）；若同一孔重複 NOK 且初段扭力超過 0.30 N·m（模擬值），改走 SOP-ASM-012；若低扭力且角度低、有間隙，改走 SOP-ASM-011。
- 抽測送釘盤與補料盒 5 顆（模擬值）螺絲，量測長度、牙距與頭型並比對 BOM，確認無混批、無不同頭型；判定：全部符合 BOM 且長度偏差在 ±0.2 mm（模擬值）內；若發現混料，立即隔離並通知品保工程師。
- 連續鎖附 10 件（模擬值）或 20 孔（模擬值），確認無 NOK_ANGLE_LOW／NOK_ANGLE_HIGH，並觀察送釘與鎖附曲線；判定：連續 10 件（模擬值）或 20 孔（模擬值）之鎖附結果全部正常，無角度異常、無送釘逾時或吸附失敗；若送釘逾時或吸附失敗且起子端無螺絲，改走 SOP-ASM-021；若起子頭打滑，改走 SOP-ASM-013。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（設施規則第254條）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若確認螺絲長度、牙距或頭型與 BOM 不符，且同批已鎖工件超過 5 件（模擬值）或已流入下游 → 通知品保工程師，啟動批號追溯與隔離。
- 若同一孔位重複 NOK 且壓鉚螺母孔牙損傷、毛邊或初段扭力超過 0.30 N·m（模擬值） → 改走 SOP-ASM-012。
- 若送釘逾時、吸附失敗或送釘軌道卡歪斜螺絲 → 改走 SOP-ASM-021。
lessons: 換批或補料後先核對料盒標籤與 BOM，再讓第一顆螺絲上線；看到角度怪怪的，先查螺絲規格與混料，不要急著調扭力或換起子頭。
