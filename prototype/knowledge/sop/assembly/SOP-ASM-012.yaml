  criteria: 通規無法順利旋入，或止規可進入超過 2 牙（模擬值），判定孔牙損傷或滑牙，為本模式；若通規與止規判定正常，且手動比對無偏斜，但設備鎖附仍低扭力或浮鎖，改懷疑 torque_not_reached。
  caution: 使用通規與止規時保持垂直，不可硬轉或擴孔；量規使用前確認無毛邊與汙物。
