verify:
- 修復後首件之外觀與孔牙確認：檢查孔口無毛邊、鋅渣、塗料堵塞，壓鉚螺母端面齊平且凸出不得超過 0.1 mm（模擬值），螺絲頭與工件貼平無間隙；以螺紋通規與止規複查；判定：孔口無毛邊與異物，壓鉚螺母無歪斜鬆動，凸出量不大於 0.1 mm（模擬值）；通規可順利旋入，止規不得進入超過 2 牙（模擬值）；螺絲頭與工件無可見間隙。
- 需要通電量測、移動設備、試銲或試鎖時，依 LOTO-ASM-TOOL-01 測試／定位程序：需要通電試鎖、量測扭力或執行功能測試時：由原上鎖人取下自己的插頭鎖蓋並插回電源，班長知悉；只在治具上用試片或報廢件試鎖；手指不得放在起子頭與送釘吸嘴下方；完成後再拔插頭並套回插頭鎖蓋
- 先以試片或報廢件試鎖確認參數，再對修復後首件依首件程序鎖附並記錄初段扭力、最終扭力與角度；判定：試片或報廢件試鎖初段扭力不得大於 0.30 N·m（模擬值），最終扭力達 0.8 N·m（模擬值）且判定 OK；修復後首件同一 hole_id 不得再出現 NOK_HIGH_TORQUE_EARLY 或 NOK_ANGLE_HIGH，最終角度落在作業標準範圍（模擬值），依現行扭力判定上下限判定，不得放寬。
- 連續鎖附同一孔位 5 件（模擬值）進行首件追蹤與扭力抽測，確認 NOK 未重現；將更換件、螺絲批、起子頭與維修紀錄建檔後才放行；判定：連續 5 件（模擬值）同一 hole_id 皆判定 OK，初段扭力均不大於 0.30 N·m（模擬值），最終扭力達 0.8 N·m（模擬值）且角度在標準範圍（模擬值）；若任一 NOK 重現，停止放行並通知品保工程師／設備工程師。
restore:
- 依 LOTO-ASM-TOOL-01 解除程序：清點工具與螺絲、恢復護蓋後，由原上鎖人親自取下自己的插頭鎖蓋與標籤再插回電源（參考 OSHA 1910.147(e)(3)）；AI 不得宣告可以復電
- 隔離中的可疑工件由品保判定重工或放行，首件由班長確認後才恢復量產
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 若同一 hole_id 更換同規格壓鉚螺母與螺絲後仍重複 NOK，或孔牙崩壞無法更換修復 → 通知品保工程師／設備工程師。
- 若發現起子頭刃口圓化、缺角、cam-out 打滑聲或使用次數超過 40000 次（模擬值） → 改走 SOP-ASM-013。
- 若螺絲長度、牙距或頭型與 BOM 不符，或送料盤混有不同規格螺絲 → 改走 SOP-ASM-022。
lessons: 斜牙／滑牙先確認是否固定同一孔位與孔口損傷，不要用加大扭力或硬鎖掩蓋；換件後務必做首件確認與追溯。
