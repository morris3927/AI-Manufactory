- 'no': 6
  phase: inspect
  action: 以放大鏡目視檢查同一 hole_id 的壓鉚螺母與攻牙孔口，查看斜牙、滑牙、毛邊、鋅渣、塗料堵塞或螺紋崩壞；同時隔離並標示該 NOK 工件。
  criteria: 孔口可見斜牙、滑牙、毛邊、鋅渣或塗料堵塞，或壓鉚螺母歪斜、鬆動、端面未貼平，判定為本模式；若孔口完好、無異物且螺絲頭與工件間有可見間隙，改懷疑 torque_not_reached。
  caution: 鈑金銳邊可能割傷，戴防割手套並使用照明；不可用手指直接探孔或強行刮除孔內異物。
  requires_supervisor: false
