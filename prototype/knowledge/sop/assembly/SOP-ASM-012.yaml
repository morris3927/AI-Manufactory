- 'no': 5
  phase: inspect
  action: 讀取鎖附控制器紀錄與 NOK 清單，核對 hole_id、rundown_torque_nm、screw_result 與角度曲線；確認是否固定同一孔位重複 NOK。
  criteria: 若初段扭力大於 0.30 N·m（模擬值）即判 NOK_HIGH_TORQUE_EARLY，或角度超過上限仍到不了 0.8 N·m（模擬值）而判 NOK_ANGLE_HIGH，且 NOK 固定同一 hole_id，判定為本模式；若最終扭力低於 0.72 N·m（模擬值）、角度低於正常下限且 NOK 分散不同孔位或集中同班作業員，改懷疑 torque_not_reached；若換螺絲批或補料後才發生且最終角度明顯偏離，改懷疑 wrong_screw_type。
  caution: 紀錄於上鎖前匯出或截取；紀錄先備份再維修，不得變更鎖附判定參數。
  requires_supervisor: false
  requires_energized: false
