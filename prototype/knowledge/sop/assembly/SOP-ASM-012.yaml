- 'no': 7
  phase: inspect
  action: 檢查 NOK 螺絲與送料盤內螺絲的長度、牙距、頭型與外觀，並檢查起子頭刃口、十字槽磨耗與使用次數。
  criteria: 若螺絲長度、牙距或頭型與 BOM 不符，或送料盤混有不同規格螺絲，改懷疑 wrong_screw_type；若起子頭刃口圓化、缺角、使用次數超過 40000 次（模擬值），或鎖附時有 cam-out 打滑聲且 NOK 分散各孔位，改懷疑 bit_wear_camout；若螺絲規格正確、起子頭完好，但同一孔換新螺絲仍重複 NOK，支持本模式。
  caution: 可疑螺絲批與起子頭要分開標示隔離，不可把混料螺絲倒回送釘機。
  requires_supervisor: false
