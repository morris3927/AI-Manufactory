symptoms:
- 斜牙
- 滑牙
- 同一孔一直鎖不上
- 螺絲歪著進去
- 孔牙壞掉
- 螺絲歪著進去，鎖起來卡卡的。
- 同一孔一直鎖不上，換新螺絲也一樣。
- 旋入沒幾圈扭力就飆高，控制器判 NOK。
- 孔口看得到毛邊、鋅渣或塗料，壓鉚螺母好像受傷。
- 角度一直轉卻到不了目標扭力，最後孔牙崩掉。
