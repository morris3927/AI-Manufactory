verify:
- 啟動冷卻水循環，量測點銲機與水冷銲槍流量、回水溫度，並確認警報已消失；判定：點銲機流量 ≥3.0 L/min（模擬值）、水冷銲槍流量 ≥1.0 L/min（模擬值）、回水溫度 ≤45 °C（模擬值），且無 COOLANT_LOW 或 WELD_OVERTEMP 警報。
- 使用試片或報廢件進行試銲／試點銲功能測試；MIG 試銲前確認局部排氣運轉正常，人員退到圍欄或遮光簾外；點銲時手不得放在上下電極之間；若測試不良，將試片或報廢件隔離並標示追溯；判定：MIG 銲道無燒穿、未熔合、氣孔，飛濺量與首件相當（模擬值）；點銲熔核直徑 ≥4.5 mm（模擬值），無異常飛濺；測試期間流量與回水溫度維持正常。
- 執行首件確認並連續生產 5 件（模擬值），檢查電極帽與銲槍頸管有無異常升溫或變形；判定：連續 5 件（模擬值）流量與回水溫度仍在上限內，電極帽端面無短時間異常變形、頸管無過熱，首件尺寸與熔核符合標準（模擬值）。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清潔濾網、排除折管並補液後，點銲機流量仍低於 3.0 L/min（模擬值）或水冷銲槍流量仍低於 1.0 L/min（模擬值） → 通知設備工程師。
- 回水溫度持續超過 45 °C（模擬值），且泵浦運轉與管路無折彎 → 通知設備工程師。
- 電極帽在短時間內異常變形，但流量與回水溫度正常 → 改走 SOP-WLD-041（點銲電極頭磨耗）。
lessons: 冷卻水不足常從濾網堵塞與折管開始；先看流量與回水溫度，再怪電極帽，才不會把磨耗誤判成過熱。
