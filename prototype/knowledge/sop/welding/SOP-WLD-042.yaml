  criteria: 端面直徑超過 6.5 mm（模擬值；新品 5.0～5.5 mm（模擬值））、端面凹陷或沾鋅變色，或修磨次數超過 25 次（模擬值）、銲點數超過 350 點（模擬值），且冷卻水流量正常，則改懷疑點銲電極頭磨耗（spot_electrode_wear）；若流量低且電極帽變形，仍以本模式為主並一併更換電極帽。
