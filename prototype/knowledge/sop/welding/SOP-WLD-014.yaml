- 'no': 10
  phase: inspect
  action: 以通規量測導電嘴孔徑並目視孔口形狀，同時核對導電嘴累積起弧時間。
  criteria: 孔徑未超過 1.2 mm（模擬值）、孔口仍為圓形、無銲絲熔黏，累積起弧時間未超過 300 分鐘（模擬值）→ 排除 contact_tip_wear；若孔口磨成橢圓、銲絲熔黏在端部（回燒），或每百次起弧重試超過 8 次（模擬值）→ 改走 SOP-WLD-012（導電嘴磨耗／回燒）。
  caution: 量測時不得轉動送絲馬達或手動送絲，避免銲絲突然竄出傷手。
