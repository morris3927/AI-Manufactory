- 'no': 9
  phase: inspect
  action: 由原上鎖人暫時解除保護氣體隔離，在銲槍出口裝流量計量測保護氣體流量，量測期間不起弧。
  criteria: 流量維持在 15～20 L/min（模擬值）→ 支持本模式（氣路正常，問題在噴嘴積渣）；若流量低於 12 L/min（模擬值）、量測時讀值明顯飄動，或氣瓶／匯流排壓力下降 → 改走 SOP-WLD-013（保護氣體不足）。
  caution: 量測前確認局部排氣運轉正常、人員退到圍欄或遮光簾外；量測時不得起弧，也不得將手放在銲槍出口正前方。
  requires_supervisor: false
