  - REG-N0060009-292
- 'no': 7
  phase: inspect
  action: 在教導器維護頁面讀取清槍紀錄：距上次清槍時間、清槍程式執行結果、警報代碼與每百次起弧的重試次數，只讀取不操作設備。
  criteria: torch_clean_interval_min 大於 45 分鐘（模擬值），或出現 CLEAN_STATION_FAULT，或清槍程式在部分循環未被執行 → 判定為本模式；若清槍間隔正常、清槍程式每循環都完成，氣孔仍隨件數上升 → 改懷疑 shielding_gas_low 或 contact_tip_wear。
  caution: 僅讀取畫面，不得切換到自動運轉；若必須操作教導器，只能在教導模式降速並全程握住致能開關。
