- 'no': 5
  phase: inspect
  action: 在銲槍已冷卻的前提下，拆下噴嘴，用放大鏡或內視鏡目視噴嘴內壁、保護氣出口與端面，記錄銲渣堆積位置與遮擋面積。
  criteria: 噴嘴內壁可見銲渣堆積、保護氣出口被遮住超過三分之一（模擬值），且端面飛濺附著成塊 → 判定為本模式；若噴嘴內壁乾淨、出氣孔暢通，銲道卻仍有氣孔 → 改懷疑 shielding_gas_low（SOP-WLD-013）。
  caution: 銲槍、噴嘴與導電嘴仍帶餘熱（R9），必須戴耐熱手套並確認已降溫至常溫再拆；不得用尖銳工具刮傷氣體分配器出氣孔。
  requires_supervisor: false
  requires_energized: false
