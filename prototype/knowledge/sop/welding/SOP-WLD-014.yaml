symptoms:
- 噴嘴塞渣
- 氣孔慢慢變多
- 清槍站沒動作
- 飛濺黏在噴嘴
- 銲道不漂亮
- 噴嘴塞渣，噴嘴內壁卡一圈銲渣，保護氣出口被遮住
- 氣孔慢慢變多，一批比一批多，不是突然整條爆氣孔
- 清槍站沒動作，或清槍程式沒執行、出現 CLEAN_STATION_FAULT
- 飛濺黏在噴嘴端面與內壁，越積越大塊
- 銲道不漂亮，銲道表面粗糙、魚鱗紋不均
