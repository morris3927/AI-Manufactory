- 'no': 13
  phase: repair
  action: 檢修清槍站：更換切削刀片、清空集渣盒、調整噴嘴對心與清槍高度，並依清槍時間 1.5 秒（模擬值）、清槍氣壓 0.5 MPa（模擬值）設定。
  caution: 不得停用或繞過清槍站的防護與連鎖；刀片更換後須確認鎖緊，避免運轉時飛出。
  requires_supervisor: false
  requires_energized: false
