verify:
- 在人員退到圍欄或遮光簾外、局部排氣運轉正常的條件下，空跑清槍程式 3 次（模擬值），觀察清槍站動作與噴嘴清潔結果；判定：3 次（模擬值）連續執行成功、無 CLEAN_STATION_FAULT，下槍後噴嘴內壁無殘渣、保護氣出口完全暢通 → 判定修復完成；若清槍站仍反覆報 CLEAN_STATION_FAULT → 通知機器人工程師檢修清槍站。
- 以報廢試片進行試銲 5 條銲道（模擬值），檢查銲道表面與剖面氣孔、飛濺量；判定：銲道表面與剖面無氣孔、飛濺附著量明顯少於修復前，銲道成形正常 → 判定改善；若氣孔仍持續出現且流量偏低 → 改走 SOP-WLD-013。
- 恢復生產並執行首件確認，連續生產 20 件（模擬值）後檢視氣孔率與清槍間隔紀錄；判定：首件確認合格，連續 20 件（模擬值）氣孔率不超過 1%（模擬值）、defect_rate_pct 不再逐步上升，清槍間隔維持在 45 分鐘（模擬值）以內 → 結案；若氣孔率仍隨件數上升 → 通知品保工程師並改走 SOP-WLD-012 或 SOP-WLD-013 續查。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換噴嘴並確認清槍站動作正常後，氣孔仍隨生產件數增加 → 改走 SOP-WLD-013（保護氣體不足），並通知設備工程師。
- 清槍站反覆出現 CLEAN_STATION_FAULT，更換刀片與清空集渣盒後仍未改善 → 通知機器人工程師檢修清槍站。
- 導電嘴孔口磨成橢圓、銲絲熔黏或每百次起弧重試超過 8 次（模擬值）→ 改走 SOP-WLD-012（導電嘴磨耗／回燒）。
lessons: 噴嘴積渣是「慢慢變壞」的故障，別等到客訴氣孔才清槍；清槍紀錄與噴嘴目視，永遠比銲道外觀更早透露問題。
