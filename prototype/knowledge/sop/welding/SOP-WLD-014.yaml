- 'no': 12
  phase: repair
  action: 拆下積渣噴嘴，清潔銲槍頸部與氣體分配器出氣孔，更換新噴嘴與耐熱 O 形環，依 2.5 N·m（模擬值）鎖付並確認出氣孔與銲絲同心。
  caution: 鎖付扭力不得任意放寬或加大；氣體分配器出氣孔不得擴孔或刮傷，O 形環不得塗抹含油潤滑劑。
  requires_supervisor: false
