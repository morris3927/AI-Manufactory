- 'no': 8
  phase: inspect
  action: 在上鎖狀態下目視檢查清槍站機構：切削刀片刃口、噴嘴夾持爪、噴嘴對心位置、集渣盒容量與清槍站氣源閥狀態。
  criteria: 刀片刃口缺口大於 0.5 mm（模擬值）、夾持爪鬆動、噴嘴對心偏移超過 1 mm（模擬值），或集渣盒已達八分滿（模擬值）→ 判定清槍效率不足，屬本模式成因；若清槍站機構外觀與對心皆正常 → 需回頭確認清槍程式與參數設定。
  caution: 清槍站內部可能夾藏高溫銲渣與短段銲絲，取集渣盒時戴耐熱手套，避免割傷。
  requires_supervisor: false
