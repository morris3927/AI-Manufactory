  - REG-N0060025-28
- 'no': 14
  phase: repair
  action: 調整清槍執行週期為每 20 件（模擬值）或每 30 分鐘（模擬值）執行一次，並確認清槍程式排在每個銲接循環結束後執行，修改後留存程式版本紀錄。
  caution: 只調整清槍週期與清槍程式順序，不得修改機器人速度限制、安全區域、碰撞偵測靈敏度等安全相關參數；程式修改須由主管覆核。
  requires_supervisor: true
