  phase: verify
  action: 在人員退到圍欄或遮光簾外、局部排氣運轉正常的條件下，空跑清槍程式 3 次（模擬值），觀察清槍站動作與噴嘴清潔結果。
  criteria: 3 次（模擬值）連續執行成功、無 CLEAN_STATION_FAULT，下槍後噴嘴內壁無殘渣、保護氣出口完全暢通 → 判定修復完成；若清槍站仍反覆報 CLEAN_STATION_FAULT → 通知機器人工程師檢修清槍站。
