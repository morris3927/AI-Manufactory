verify:
- 由原上鎖人暫時解除上鎖、主管在場，於教導模式降速並握住致能開關，做低速空送絲（不引弧），連續送絲 5 m（模擬值），同時觀察送絲實際速度與送絲馬達電流；判定：送絲實際速度與設定值差異在 ±5% 以內（模擬值），1 分鐘內沒有忽快忽慢；送絲馬達電流穩定低於 4.5 A（模擬值），未出現 WIRE_FEED_OVERLOAD。
- 確認局部排氣運轉正常、人員退到圍欄或遮光簾外後，在試片或報廢件上試銲，觀察起弧與電弧穩定度；判定：連續 3 次起弧皆成功（模擬值），未出現 ARC_LOST 或 ARC_START_FAIL；電弧電流變異不超過 12%（模擬值）；銲道外觀無氣孔、燒穿、未熔合，飛濺量與平常相當。
- 設備停止後量測首件試片的銲道寬度與熔深，並核對送絲速度紀錄，完成首件確認；判定：銲道寬度與熔深落在首件標準範圍內（模擬值），送絲速度紀錄在 1 分鐘內無忽快忽慢；首件確認合格才可交還生產。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清潔並更換送絲輪、送絲導管後，送絲馬達電流仍超過 4.5 A（模擬值）或反覆出現 WIRE_FEED_OVERLOAD → 通知設備工程師檢查送絲馬達與驅動器。
- 送絲速度與送絲馬達電流都正常，但電弧電壓變異超過 10%（模擬值）且只出現在單一工位 → 改走 SOP-WLD-015（接地不良）。
- 導電嘴累積起弧時間超過 300 分鐘（模擬值）或孔口已磨成橢圓 → 改走 SOP-WLD-012（導電嘴磨耗／回燒）。
lessons: 鳥巢八成不是送絲馬達壞掉，先看送絲輪溝槽、加壓張力與導管內的鐵屑；剪線清導管通常比換馬達快得多，但別忘了最後還是要試銲與首件確認。
