- 銲不到接縫
- 撞槍後銲道跑掉
- 換頸管後位置不準
- 每一件都偏同一邊
- 銲道整批偏同一邊，兩個工位、所有治具、所有工件都一樣偏
- 撞槍之後銲道就跑掉，銲不到接縫
- 換過銲槍頸管或銲槍本體後，位置就不準了
- 每一件都偏同一側，換治具、換批工件也一樣
- 教導器出現 TCP 校驗偏差，但電弧電流與電壓看起來很穩
