verify:
- 在教導模式下低速空跑，將銲絲尖端分別對準校正棒與試片上的基準十字，確認 TCP 重現性；判定：連續 3 次（模擬值）對點偏差均在 0.5 mm（模擬值）以內，且方向一致無漂移，判定校正有效。
- 試銲驗證：確認局部排氣運轉正常、人員退到圍欄或遮光簾外後，於兩個工位各試銲 3 件（模擬值），量測銲道中心線相對接縫的偏移量；判定：兩個工位試銲件的銲道偏移量均在 ±0.5 mm（模擬值）以內，無偏邊、無未熔合、無燒穿，判定修復完成。
- 首件確認：由品保依首件檢查表確認銲道位置、外觀與熔深，並連續量測 5 件（模擬值）建立偏移趨勢紀錄，兩個工位都要取樣；判定：首件檢查全部項目合格，且連續 5 件（模擬值）偏移量變異在 0.3 mm（模擬值）以內，無往同一方向累積的趨勢，方可交回生產。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- TCP 重新校正後偏差仍超過 1.0 mm（模擬值），或短期內重複發生撞槍 → 通知機器人工程師檢查第六軸背隙與防撞檢知座。
- 發現槍身固定座裂紋、頸管反覆鬆動或機器人手臂有異音 → 通知設備工程師。
- 偏移只集中在單一治具，或實測接合間隙超過 0.5 mm（模擬值）、定位銷磨耗、夾爪鬆動 → 改走 SOP-WLD-031。
lessons: 撞槍或換頸管後一定要重做 TCP 校驗並留下校正前後數值，不要只憑肉眼看著「差不多」就開線，否則整批工件會一起偏同一邊。
