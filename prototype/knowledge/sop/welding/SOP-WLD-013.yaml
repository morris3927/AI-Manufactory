verify:
- 量測保護氣流量與供氣壓力，並持壓觀察接頭；判定：流量 15～20 L/min（模擬值）、氣瓶壓力不低於 10 bar（模擬值）或匯流排壓力不低於 2 bar（模擬值），持壓 3 分鐘（模擬值）無明顯下降且接頭無氣泡。
- 以報廢試片試銲 1 條 100 mm（模擬值）銲道；試銲時局部排氣運轉正常，人員退到圍欄或遮光簾外；判定：銲道表面無氣孔、無發黑；剖面或非破壞檢查無內部氣孔。
- 執行首件確認：每個治具各 1 件（模擬值），連續 3 件（模擬值）檢查銲道氣孔並記錄流量；判定：各治具首件銲道無氣孔，流量維持 15～20 L/min（模擬值），並記錄實測值。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（設施規則第254條）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換軟管、接頭並確認供氣後，流量仍低於 12 L/min（模擬值）或壓力持續下降 → 通知設備工程師檢查匯流排、流量計與銲槍內部氣路。
- 噴嘴內壁有銲渣堆積且清槍或更換噴嘴後氣孔改善 → 改走 SOP-WLD-014。
- 氣孔伴隨導電嘴回燒、送絲不順或接地不良現象 → 分別改走 SOP-WLD-012、SOP-WLD-011 或 SOP-WLD-015，並通知品保工程師隔離追溯可疑工件。
lessons: 氣孔突然在各治具全面出現時，先查保護氣源與接頭漏氣，不要先調銲接參數或換銲絲。
