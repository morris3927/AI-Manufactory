  criteria: 定位銷直徑磨耗超過 0.2 mm（模擬值）、定位銷用手可感覺晃動超過 0.3 mm（模擬值）、夾爪鬆動或基準面附著銲渣，判定為本模式；若定位銷與夾爪正常，但 TCP 校驗偏差超過 1.0 mm（模擬值），改懷疑 tcp_drift。
