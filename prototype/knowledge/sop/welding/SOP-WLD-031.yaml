  criteria: TCP 校驗偏差超過 1.0 mm（模擬值）且所有治具同方向偏移，改懷疑 tcp_drift；電弧電壓變異超過 10%（模擬值）、接地夾有銲渣鬆脫或發熱變色且只某工位異常，改懷疑 ground_poor；若兩者正常且定位銷、夾爪或間隙異常，判定為本模式。
