verify:
- 在尚未復電前，以手動方式確認更換後定位銷無晃動、夾爪包覆工件無翹起，並用塞尺量測工件與治具基準面接合間隙；判定：定位銷晃動小於 0.1 mm（模擬值）、接合間隙小於 0.3 mm（模擬值）、夾爪與工件貼合無翹起，判定修復完成；若間隙仍超過 0.5 mm（模擬值），判定本模式未排除。
- 在局部排氣運轉正常、人員退到圍欄或遮光簾外時，以試片或報廢件進行首件試銲；機器人採教導模式降速並握住致能開關移動，點銲機以不通電加壓模式與專用工具確認對心，手不得放在上下電極之間；判定：首件銲道無燒穿、無未熔合、無集中飛濺，熔核或銲道尺寸符合首件標準，且連續 3 件（模擬值）同一位置無缺陷，判定本模式已排除；若仍集中同一 fixture_id，改懷疑治具基準面變形或通知設備工程師。
- 完成首件檢查紀錄，量測夾爪重複定位與接合間隙，經品保工程師確認後才可批量生產；判定：首件紀錄之接合間隙小於 0.3 mm（模擬值）、定位銷晃動小於 0.1 mm（模擬值），且品保簽認無誤。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換定位銷與夾爪後，接合間隙仍超過 0.5 mm（模擬值）或同一位置仍燒穿 → 通知設備工程師／品保工程師
- 電弧電壓變異超過 10%（模擬值），且接地夾或回路電纜接頭有銲渣、鬆脫或發熱變色 → 改走 SOP-WLD-015
- 兩工位所有治具同方向偏移，TCP 校驗偏差超過 1.0 mm（模擬值） → 改走 SOP-WLD-021
lessons: 換批或換治具後先量間隙與定位銷晃動，不要只調銲接參數；缺陷集中在同一 fixture_id 時，先懷疑治具定位，不要先動 TCP。
