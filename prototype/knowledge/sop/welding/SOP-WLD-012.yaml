verify:
- 在局部排氣運轉正常、人員退到圍欄或遮光簾外之條件下進行試銲；若需移動機器人，僅在教導模式降速並握住致能開關。連續試銲 10 次（模擬值）起弧，觀察起弧、飛濺與銲道外觀；判定：10 次（模擬值）起弧全部一次成功，重試次數 0 次（模擬值），無 ARC_START_FAIL 或 WIRE_STICK；飛濺量比更換前明顯減少，銲道無氣孔、燒穿、未熔合。
- 試銲後待銲槍冷卻，目視與量測新導電嘴孔口，確認無回燒、無銲絲熔黏，孔徑在 1.0～1.1 mm（模擬值）且孔口圓整；判定：孔口圓整、孔徑在 1.0～1.1 mm（模擬值），端部無銲絲熔黏或回燒變色，判定更換有效；若孔口再次橢圓或孔徑超過 1.2 mm（模擬值），重新檢查導電嘴座與送絲對心。
- 讀取更換後之每百次起弧重試次數與導電嘴累積起弧時間，並完成首件確認紀錄；判定：每百次起弧重試次數維持在 2 次以下（模擬值），導電嘴累積起弧時間重新計時且未異常跳增；首件確認合格。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換導電嘴後，每百次起弧重試次數仍超過 8 次（模擬值）或 ARC_START_FAIL 持續發生 → 依序改查 SOP-WLD-011（送絲不順）與 SOP-WLD-015（接地不良），並通知設備工程師檢查銲接電源起弧參數
- 送絲實際速度比設定值低 10% 以上（模擬值）或送絲馬達電流超過 4.5 A（模擬值），且送絲機內有銲絲纏繞成團 → 改走 SOP-WLD-011（送絲不順／鳥巢）
- 銲槍頸管或導電嘴座有回燒變色、撞擊變形，或銲道位置整批偏移 → 改走 SOP-WLD-021（銲槍 TCP 偏移），由機器人工程師確認 TCP
lessons: 導電嘴是消耗件，不要等到 ARC_START_FAIL 才換；看到孔口橢圓、孔徑變大或銲絲回燒就應更換，並順手確認送絲路徑、噴嘴與接地，避免把單一磨耗誤判成送絲或接地問題。
