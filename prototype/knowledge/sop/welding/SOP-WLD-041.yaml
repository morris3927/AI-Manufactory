  action: 由教導器／控制器歷史頁讀取 weld_count_since_dress 與 tip_dress_count，並核對點銲電流設定值與實際讀值、加壓力設定值與實際讀值。
  criteria: weld_count_since_dress > 350 點（模擬值）或 tip_dress_count > 25 次（模擬值），且點銲電流在 9.0～11.0 kA（模擬值）、加壓力讀值在設定範圍內 → 判定為本模式（電流正常但電流密度因端面變大而下降）；若電流或加壓力讀值偏離設定範圍 → 改懷疑控制器或氣壓系統異常，通知設備工程師。
