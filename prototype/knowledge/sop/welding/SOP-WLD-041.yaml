verify:
- 以報廢試片連續試銲 5 點（模擬值），逐點進行剝離試驗並量測熔核直徑；判定：5 點（模擬值）熔核直徑皆 ≥ 4.5 mm（模擬值）、無燒穿、無未熔合、飛濺量正常 → 合格；任一點不足 → 重新修磨或更換電極帽後再驗，仍不合格則通知品保工程師。
- 量測修磨後電極帽端面直徑與端面狀況，並核對修磨後累計銲點數；判定：端面直徑在 5.0～5.5 mm（模擬值）、端面平整無凹陷、無沾鋅變色；修磨後累計銲點數未超過 350 點（模擬值）。
- 會同品保進行首件確認，量測首件熔核直徑與外觀，並將結果登錄於首件檢查表；判定：首件熔核直徑 ≥ 4.5 mm（模擬值）、外觀無飛濺、無氣孔、無燒穿，量測記錄完成並簽核 → 才可恢復量產。
restore:
- 依 LOTO-SPOT-WELD-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 更換電極帽並修磨後，剝離試驗熔核直徑仍 < 4.5 mm（模擬值）且電流、加壓力讀值正常 → 通知品保工程師，並改走 SOP-WLD-031 檢查治具貼合與接合間隙。
- 冷卻水流量 < 3.0 L/min（模擬值）或回水溫度 > 45 °C（模擬值），或出現流量低／過熱警報 → 改走 SOP-WLD-042。
- 電極座錐面燒蝕、冷卻水路滲漏、控制器電流輸出異常，或 SPOT_CURRENT_DEV 警報重複發生 → 通知設備工程師。
lessons: 電極帽是耗材，與其反覆調高電流硬銲，不如照銲點數與端面直徑按時修磨更換，才不會把飛濺與熔核不足的帳算到治具或材料上。
