- 'no': 12
  phase: verify
  action: 需要通電量測、移動設備、試銲或試鎖時，依 LOTO-WELD-ROBOT-01 測試／定位程序：清除圍欄內工具；需留在可動範圍內的人員只限持教導器者；由原上鎖人取下自己的鎖，現場主管在場，並在圍欄外安排監視人員（第26條）；只用教導模式降速操作，持教導器者握住致能開關，放手即停（第5、9條）；試銲時人員退到圍欄外並確認局部排氣運轉；完成後立即停機，重新上鎖並驗證零能量，才能再次進入圍欄
  caution: 通電期間手不得進入機器人可動範圍或電極之間；試銲前確認局部排氣運轉、人員退到圍欄或遮光簾外（設施規則第292條）
