- 'no': 6
  phase: inspect
  action: 使用低電阻計量測有問題側治具接地夾至銲接電源接地端子（或回路電纜終端）之接地回路電阻，並與正常側比較；量測點先清潔，探棒確實接觸金屬面。
  criteria: 有問題側接地回路電阻超過 0.1 Ω（模擬值），或比正常側高 50%（模擬值）以上，判定接地不良；若兩側均低於 0.05 Ω（模擬值）且差異小於 10%（模擬值），排除本模式。
  caution: 量測前確認隔離與放電完成；不得跨接不同電壓源或自行改接廠內接地系統。
  requires_supervisor: false
  requires_energized: false
