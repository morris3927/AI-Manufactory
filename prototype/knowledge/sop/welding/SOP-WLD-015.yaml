  criteria: 電弧聲音穩定，arc_voltage_cv_pct 不超過 10%（模擬值），銲道寬窄差不大於 1.0 mm（模擬值），且電流與送絲馬達電流正常，判定接地修復有效；若電壓仍跳動超過 10%（模擬值），回修接地路徑或通知設備工程師。
