  - REG-OSHA-1910.254-d-3
  - REG-OSHA-1910.254-d-4
- 'no': 7
  phase: inspect
  action: 調閱最近數班別之 arc_voltage_cv_pct、arc_current_a、wire_feed_motor_current_a 與起弧重試紀錄，核對是否只在某一個工位（變位機某一側）出現，並與生產時間長短比對。
  criteria: arc_voltage_cv_pct 超過 10%（模擬值），但電流設定、實際電流與送絲馬達電流正常，且問題只跟某側工位相關，支持本模式；若送絲實際速度比設定低 10% 以上（模擬值）或送絲馬達電流超過 4.5 A（模擬值），改懷疑送絲不順／鳥巢（SOP-WLD-011）；若起弧重試次數超過 8 次（模擬值）或導電嘴累積起弧時間超過 300 分鐘（模擬值），改懷疑導電嘴磨耗／回燒（SOP-WLD-012）。
  caution: null
  requires_supervisor: false
  requires_energized: false
