- 'no': 8
  phase: inspect
  action: 檢查有問題側治具夾爪、定位銷與工件接合面，使用間隙規實測接合間隙，並比對其他治具與工件批號；必要時以正常側同程式比對。
  criteria: 若燒穿、未熔合或點銲飛濺集中在同一治具編號（fixture_id）或同一銲點，且實測接合間隙超過 0.5 mm（模擬值），或定位銷磨耗、夾爪鬆動，改懷疑治具定位不良／間隙過大（SOP-WLD-031）；若接合間隙不超過 0.5 mm（模擬值）、定位銷與夾爪正常，且不良隨工位側別切換，支持接地不良。
  caution: 使用專用間隙規，不得將手伸入夾爪或變位機動作範圍；此步不得通電。
  requires_supervisor: false
