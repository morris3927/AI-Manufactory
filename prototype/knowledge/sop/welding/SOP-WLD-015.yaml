- 'no': 5
  phase: inspect
  action: 在完成上鎖掛牌且待銲槍、接地夾冷卻後，目視檢查雙工位變位機兩側之接地夾齒面、夾持面、回路電纜接頭與端子，並手動確認有無鬆脫、銲渣、氧化、發熱變色或電纜外皮破損；特別比對有問題側與正常側。
  criteria: 有問題側接地夾或回路電纜接頭出現銲渣堆積、氧化、鬆脫、發熱變色或外皮破損，且正常側無相同現象，判定為本模式高度可疑；若兩側接地夾與接頭外觀均正常，先保留本模式但改查送絲與導電嘴。
  caution: 確認上鎖掛牌完成且電容放電；不得以手直接觸摸可能高溫或帶電端子。
  requires_supervisor: false
  requires_energized: false
