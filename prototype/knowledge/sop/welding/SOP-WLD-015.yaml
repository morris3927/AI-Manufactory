verify:
- 需要通電量測、移動設備、試銲或試鎖時，依 LOTO-WELD-ROBOT-01 測試／定位程序：清除圍欄內工具；需留在可動範圍內的人員只限持教導器者；由原上鎖人取下自己的鎖，現場主管在場，並在圍欄外安排監視人員（第26條）；只用教導模式降速操作，持教導器者握住致能開關，放手即停（第5、9條）；試銲時人員退到圍欄外並確認局部排氣運轉；完成後立即停機，重新上鎖並驗證零能量，才能再次進入圍欄
- 在局部排氣運轉正常、人員退至圍欄或遮光簾外後，於有問題側工位以原銲接程式試銲一段試片；觀察電弧聲音、電壓變異與銲道外觀；判定：電弧聲音穩定，arc_voltage_cv_pct 不超過 10%（模擬值），銲道寬窄差不大於 1.0 mm（模擬值），且電流與送絲馬達電流正常，判定接地修復有效；若電壓仍跳動超過 10%（模擬值），回修接地路徑或通知設備工程師。
- 試銲後立即以測溫計量測有問題側接地夾、回路電纜接頭與端子溫升，並目視有無變色或異味；判定：接地夾與接頭溫升不超過 15°C（模擬值），且無變色、異味或鬆動，判定正常；若溫升超過 15°C（模擬值）或再次發熱變色，重新清潔緊固並通知設備工程師檢查回路電纜與電源接地端子。
- 執行首件確認：在正常側與有問題側各取一件，以相同程式試銲並比對電弧電壓變異、銲道外觀與熔深；必要時會同品保工程師確認；判定：兩側 arc_voltage_cv_pct 差異不超過 5%（模擬值），銲道無未熔合、燒穿、氣孔，且首件檢驗合格，判定修復完成；若只有原問題側仍異常，改查治具定位不良／間隙過大（SOP-WLD-031）或銲槍 TCP 偏移（SOP-WLD-021）。
restore:
- 依 LOTO-WELD-ROBOT-01 解除程序：清點工具、恢復安全門連鎖與護罩、確認人員離開機器人可動範圍與電極區後，由原上鎖人親自取下自己的鎖具與標籤（參考 OSHA 1910.147(e)(3)）；送電前確認作業人員無感電之虞，並拆除短路接地器具（如有使用）與標示（設施規則第254條第2項）；AI 不得宣告可以復電
- 在 Kanban 填寫實際原因、處置內容與處置後是否恢復正常（J5 結案回寫）
escalate_if:
- 清潔與緊固後，有問題側接地回路電阻仍超過 0.1 Ω（模擬值），或試銲後接頭再次發熱變色 → 更換回路電纜總成，並通知設備工程師檢查銲接電源接地端子
- 接地修復後 arc_voltage_cv_pct 仍超過 10%（模擬值），且送絲速度、送絲馬達電流與導電嘴都正常 → 通知設備工程師檢查銲接電源輸出
- 送絲馬達電流超過 4.5 A（模擬值）、送絲速度低於設定 10% 以上（模擬值）或送絲導管有卡阻 → 改走 SOP-WLD-011（送絲不順／鳥巢）
lessons: 接地不良不要用調高電壓或電流硬銲；先把該側接地夾齒面、回路電纜接頭與端子清乾淨、鎖緊，再用試銲與兩側比對確認。
references:
