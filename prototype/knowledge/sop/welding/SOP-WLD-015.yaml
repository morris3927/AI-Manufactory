symptoms:
- 電弧不穩
- 電壓跳動
- 銲道寬窄不一
- 接地夾發燙
- 只有一側工位有問題
- 電弧聲音不穩、忽大忽小，起弧感覺斷斷續續。
- 電壓跳動，銲道寬窄不一，外觀忽寬忽窄。
- 接地夾或回路電纜接頭發燙、變色，甚至聞到過熱異味。
- 只有變位機某一側工位會發生，換到另一側就正常。
- 同一銲接程式與送絲設定下，某側工位特別容易起弧不順。
