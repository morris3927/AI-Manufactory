  caution: 本模式常伴隨接地夾或回路電纜接頭發熱變色，上鎖掛牌後仍須待冷卻再觸碰；雙工位變位機有重力儲能，檢查前確認轉台已固定，避免鬆開接地夾時工件或轉台移動。
