cases:
  CASE-WLD-0011:
    replace:
    - - 確認起弧與送絲匹配
      - 確認起弧狀況並協助判定銲絲批次品質
  CASE-WLD-0023:
    set:
      parts_replaced:
      - nozzle
      - contact_tip
  CASE-WLD-0030:
    replace:
    - - FX-C間隙大 加墊片
      - FX-C間隙大 換定位銷
    - - 加墊片調整定位銷與夾爪
      - 更換磨耗定位銷並調整夾爪
    - - FX-C 加墊片調整間隙
      - FX-C 更換磨耗定位銷並調整夾爪
    set:
      parts_replaced:
      - torch_neck
      - torch_mount_insulator
      - locating_pin
  CASE-WLD-0042:
    replace:
    - - 再看TCP校驗 尖點沾銲渣 讀值偏 清掉重測ok
      - 再查品保量測治具 歸零錯誤 重新歸零複測ok
    - - 檢視 TCP 校驗紀錄與校驗尖點
      - 檢視品保量測治具與判定紀錄
    - - 尖點沾銲渣，讀值偏
      - 量測治具歸零錯誤
    - - 清潔校驗尖點後重新校驗 TCP
      - 量測治具重新歸零後複測
    - - 後續在 TCP 校驗尖點找到銲渣造成的讀值偏差
      - 後續查出品保量測治具歸零錯誤造成誤判
    - - TCP 校驗尖點清潔後重測讀值恢復正常，偏差消失
      - 品保量測治具重新歸零後複測，燒穿判定消失
    - - 續查 TCP 校驗紀錄，發現校驗尖點沾附銲渣造成讀值偏差，清潔後重測恢復正常
      - 續查品保量測治具，發現歸零錯誤造成誤判，重新歸零後複測正常
    - - 就回頭查 TCP 校驗尖點是否沾渣
      - 就回頭查品保量測治具有沒有歸零
  CASE-ASM-0018:
    replace:
    - - 舊 bit 打滑，新 bit 改善
      - 舊 bit 打滑；新 bit 仍偶發打滑，夾頭疑似偏擺
    - - 換新bit試鎖ok 待工具原廠
      - 換新bit仍偶發打滑 夾頭疑偏擺 待工具原廠
    - - 換新後試鎖改善。惟後續仍需工具原廠技師確認工具狀態
      - 換新後打滑減少但仍偶發，起子夾頭疑似偏擺，需工具原廠技師檢修
    - - 因需原廠確認工具狀態
      - 因起子夾頭偏擺需原廠檢修
    - - 惟工具狀態仍需原廠確認
      - 惟換新起子頭後仍偶發打滑、夾頭疑似偏擺，需原廠檢修
  CASE-ASM-0028:
    replace:
    - - 11:52 角度 626 度偏高、12:27 又是角度過高 NOK
      - 11:52 角度僅 626 度、12:27 又出現角度過高 NOK
    - - 最終角度 626 度偏高
      - 最終角度 626 度偏低
    - - 角度626偏高又變低
      - 角度626偏低又跳高
  CASE-ASM-0032:
    replace:
    - - 少一顆
      - 少兩顆
    - - 發現一處缺孔
      - 發現兩處缺孔
  CASE-ASM-0034:
    replace:
    - - 确实
      - 確實
  CASE-ASM-0059:
    set:
      discriminating_evidence:
      - 告警只有影像的 ppe_missing（safety_glasses）一筆，沒有設備停機或其他訊號
      - 到場確認作業員剛到站、尚未開始作業，開工時已戴上護目鏡
      - 該站護目鏡庫存 26 副，數量與尺寸足夠，不是沒有發放
  CASE-ASM-0060:
    replace:
    - - 品保工程師
      - 職安人員
    - - 品保接手
      - 職安接手
