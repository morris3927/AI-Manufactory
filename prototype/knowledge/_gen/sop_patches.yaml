# 人工審稿後對 LLM 草稿（_gen/raw/sop/*.json）的修正，assemble 時套用，確保可重現。
# 原則：用詞統一（安全塊＝設施規則第69條用語）、門檻與 failure_modes／signals.yaml 一致、
#       需要通電或氣源的步驟標 requires_energized、移除不適合伺服沖床或有危險的作法。
# 套用順序：global_replace → per_sop.replace（字串取代，對整份 JSON 生效）→ per_sop.set（整欄覆寫；
#           path 為 phase.index.field，或單一頂層欄位如 isolate_caution）。
# 2026-10-21 加入 AI 角色扮演審核（模擬資深維修課長）的修正，逐項說明見 knowledge/reviews/2026-10-21_press_chief.md。

# 審核中繼資料：assemble 時寫進每份 SOP（review_status、reviewed_by、review_note、review_date、review_doc）
review:
  status: approved
  reviewed_by: [ai_sim_reviewer_press_chief]
  review_note: "AI 角色扮演審核（模擬資深維修課長），非真人專家審核"
  review_date: "2026-10-21"
  review_doc: reviews/2026-10-21_press_chief.md

global_replace:
  - ["以支撐塊固定", "放入安全塊"]
  - ["支撐塊", "安全塊"]
  - ["機械擋塊", "安全塊"]
  - ["安全支柱", "安全塊"]
  - ["下死點安全塊", "安全塊"]
  - ["安全塊或安全塊", "安全塊"]          # 上面幾條取代後產生的重複字
  - ["扭矩扳手", "扭力扳手"]              # 台灣慣用「扭力」
  - ["分釐卡", "分厘卡"]
  - ["屏蔽纜線", "遮蔽纜線"]
  - ["屏蔽接地", "遮蔽層接地"]

per_sop:
  SOP-STP-007:
    replace:
      - ["核對換料時間點、換料後 30 分鐘內是否開始異常", "核對換料時間點、換料後 30 分鐘（模擬值）內是否開始異常"]
      - ["攜帶式硬度計", "試片剪刀與樣品袋（硬度送品保量測）"]
    set:
      - path: inspect.1.action
        value: 在停機上鎖狀態下，於問題料捲的前、中、後段各取 3 點（模擬值）以分厘卡量測料厚；另剪取試片送品保，以表面洛氏硬度（HR30T）或維氏硬度量測，與進料驗收值比對
      - path: inspect.1.criteria
        value: 料厚超出材料規格公差（例如 1.0 mm 料以 ±0.05 mm 管制，模擬值），或硬度偏離進料驗收值（例如 HR30T 差 5 點以上，模擬值）→ 判定為本模式；若料厚在公差內、距上次送料機保養已超過 30 天（模擬值），且滾輪表面有亮帶或油污 → 改懷疑 feed_roller_wear（SOP-STP-012）
      - path: inspect.4.action
        value: 若前面的紀錄比對仍無法判定：由原上鎖人暫時解除上鎖、主管在場，以寸動用問題料捲試沖單一沖次，讀取噸位峰值並與換料前紀錄比較（不必為比對而換回前一捲）
      - path: inspect.4.criteria
        value: 問題料捲的噸位峰值相對換料前紀錄差 5% 以上（模擬值），且送料長度誤差為換料當下一次改變的階躍、不是逐步累積 → 判定為本模式；差異小於 2%（模擬值）且送料長度誤差隨時間呈斜坡增加 → 改懷疑 feed_roller_wear（SOP-STP-012）
      - path: repair.2.caution
        value: 拆模或檢查模仁前，確認已於上下模之間放入安全塊；氮氣彈簧依模具資料洩壓後才可拆解所在模板，不得在受壓狀態下拆解
      - path: verify.0.action
        value: 以單動（一行程一停止）試沖 5 次（模擬值），量測噸位峰值與送料長度
      - path: verify.2.action
        value: 【現場經驗（模擬）】將料捲批號、料厚與硬度量測值、噸位峰值、送料長度與處置內容回填維修紀錄，並通知品保追蹤同批號的其他料捲
  SOP-STP-009:
    replace:
      - ["需合併步驟 3、4 判定", "需合併下一步（換料前後比對）與寸動送料觀察一起判定"]
      - ["張力計（料環張力用）", "捲尺（料環深度量測用）"]
      - ["並調整料環張力至 0.3～0.5 kN（模擬值）", "並確認料環深度落在料環感測器上下限之間（依設備設定）"]
      - ["並將導料間隙調整為料帶寬度加 0.5 mm（模擬值）", "並將導料寬度調整為料帶寬度加 0.5～1.0 mm（模擬值）"]
      - ["且兩側間隙均為 0.5±0.2 mm（模擬值）", "且兩側間隙合計 0.5～1.0 mm（模擬值）、任一側不得為零"]
  SOP-STP-012:
    replace:
      - ["無料空轉送料誤差在 ±0.03 mm（模擬值）以內", "送料機單獨試送（料帶不進模）誤差在 ±0.03 mm（模擬值）以內"]
      - ["料捲已落下或支撐", "料架剎車已鎖定"]
      - ["（例如 0.8 mm ±0.03 mm（模擬值））", "（例如 0.8 mm 料以 ±0.05 mm 管制，模擬值）"]
      - ['"游標卡尺"', '"游標卡尺", "量錶（附磁性座）", "鋼尺與記號筆（料帶劃線量測用）"']
    set:
      - path: inspect.2.action
        value: 以分厘卡量測上下滾輪直徑（左、中、右 3 點，模擬值）並以量錶量測偏擺；檢查滾輪壓緊彈簧壓縮量、滾輪軸承徑向間隙與左右兩側壓緊力，並目視導正銷有無磨亮或導正孔有無單向拉長
      - path: inspect.2.criteria
        value: 滾輪直徑較基準磨耗 0.05 mm 以上（模擬值）、左右直徑差 0.02 mm 以上（模擬值）、偏擺超過 0.02 mm（模擬值）、軸承徑向間隙超過 0.05 mm（模擬值），或左右壓緊力差超過 10%（模擬值）→ 判定滾輪磨損／打滑；以上都正常但導正銷磨亮、導正孔單向拉長 → 改懷疑 pilot_release_timing（SOP-STP-014）
      - path: inspect.3.action
        value: 調閱停機前 MES／Sentinel 已記錄的 feed_length_error_mm、送料機警報與馬達電流趨勢（不需對送料機送電），確認送料停止前是否有逐步累積的長度誤差
      - path: inspect.3.requires_energized
        value: false
      - path: inspect.3.caution
        value: 只讀紀錄，不要為了看紀錄而送電或起動送料機
      - path: inspect.4.action
        value: 由原上鎖人暫時解除上鎖、主管在場：先讓送料機單獨無料空轉 10 次（模擬值），比對驅動器指令與編碼器回授；再夾持短料帶讓送料機單獨送料 10 次（模擬值，料帶不進模、導正銷不作用），每次設定 50.00 mm（模擬值），停機後以鋼尺量測料帶上的劃線間距
      - path: inspect.4.criteria
        value: 空轉時指令與回授一致，但夾料後實際送料長度逐步偏短、累積到 0.15 mm（模擬值）以上 → 判定滾輪打滑；夾料單獨送料長度正常（±0.03 mm 以內，模擬值）但導正孔單向拉長 → 改懷疑 pilot_release_timing（SOP-STP-014）
      - path: inspect.4.caution
        value: 量劃線時送料機須停止，手指不得進入滾輪咬合點；導正銷釋放時人員須退開
  SOP-STP-014:
    replace:
      - ["且無料空轉量測的送料長度誤差", "且送料機單獨試送（料帶不經導正銷）量測的送料長度誤差"]
      - ["0.5 MPa（模擬值）以上", "4.8 bar（模擬值）以上"]
      - ["0 MPa（模擬值）", "0 bar（模擬值）"]
      - ["導正銷直徑磨耗超過 0.10 mm（模擬值）", "導正銷直徑磨耗超過 0.03 mm（模擬值）"]
      - ["毛邊高度不超過 0.05 mm（模擬值）", "毛邊高度不超過 0.08 mm（模擬值）"]
    set:
      - path: inspect.1.action
        value: 由原上鎖人暫時解除、主管在場，讓送料機單獨送料（料帶架空、不進模，導正銷不作用），連續量測送料長度；並從 HMI 讀取目前的導正釋放角度設定，比對該模具在目前沖速的設定表
      - path: inspect.1.criteria
        value: 連續 10 次（模擬值）送料長度誤差均在 ±0.03 mm（模擬值）內，但釋放角度設定與設定表差 5° 以上（模擬值），或參數變更後才出現 → 判定本模式；若單獨送料時誤差逐步累積超過 0.03 mm（模擬值），且滾輪有滑痕或油污 → 改懷疑 feed_roller_wear（SOP-STP-012）
      - path: inspect.1.caution
        value: 只用寸動或送料機單獨送料，防護門關閉，手不得進入模區與滾輪夾捲點
      - path: inspect.3.action
        value: 由原上鎖人暫時解除、主管在場，以寸動逐步轉動滑塊，觀察導正銷尖端進入導正孔、送料滾輪放開（釋放）與沖頭接觸料帶三個時點，並在 HMI 讀取各時點的曲軸角度
      - path: inspect.3.criteria
        value: 送料滾輪在沖頭接觸料帶時仍未放開、在導正銷尖端進入導正孔前就已放開，或在導正銷完全退出導正孔前就重新夾料，或實測釋放角度與設定表差 5° 以上（模擬值）→ 判定本模式；時點正常但送料長度誤差超過 ±0.03 mm（模擬值）→ 改懷疑 feed_roller_wear（SOP-STP-012）；時點正常但左右沖壓力差超過 10%（模擬值）且單側毛邊 → 改懷疑 die_misalignment（SOP-STP-021）
      - path: repair.1.action
        value: 依參數變更紀錄與模具資料，在 HMI 調整送料機導正釋放角度，使其與目前沖速的設定表一致；每次以 2°（模擬值）為一階調整並記錄
      - path: repair.3.action
        value: 料帶導正孔拉長是結果、不是原因，釋放時機修正後新送入的料帶就會恢復，不需處理料帶。檢查脫料板上的導正銷導套：導正銷在導套內晃動或導套單邊磨耗超過 0.02 mm（模擬值）時，會同模具技師更換導套並重新確認導正銷中心
      - path: verify.0.action
        value: 由原上鎖人暫時解除、主管在場，以寸動與送料機單獨送料驗證：連續量測送料長度，並觀察導正銷進入導正孔時滾輪是否已放開
      - path: verify.0.criteria
        value: 連續 20 次（模擬值）送料長度誤差均在 ±0.03 mm（模擬值）內，釋放角度與設定表差在 2°（模擬值）以內，且滾輪放開時導正銷已進入導正孔 → 合格
  SOP-STP-021:
    replace:
      - ["並確認滑塊已以下死點支撐座承托後", "並確認已於上下模之間放入安全塊後"]
      - ["若同一側連續出現單側毛邊高度超過 0.05 mm（模擬值）", "若同一側連續出現單側毛邊高度超過 0.08 mm（模擬值）、另一側正常"]
      - ["鎖緊固定螺栓至 45 N·m（模擬值）", "鎖緊壓板螺栓至模具資料卡扭力（例如 M16 壓板螺栓約 200 N·m，模擬值）"]
      - ["單側毛邊高度不超過 0.03 mm（模擬值）", "毛邊高度不超過 0.08 mm（模擬值）且左右差 0.03 mm 以內（模擬值）"]
      - ['"不鏽鋼墊片"', '"定位塊（依模具圖面）"']
    set:
      - path: inspect.3.action
        value: 由原上鎖人暫時解除、主管在場，以寸動試沖一次（有料），讀取左右沖壓力平衡值，並觀察導正銷進入導正孔時有無單側干涉
      - path: inspect.3.caution
        value: 只可用寸動，確認模具內無工具與人員後再動作；無料空打讀不到沖壓力，比對左右平衡必須有料
      - path: repair.3.action
        value: 【現場經驗（模擬）】定位面或定位銷孔磨耗不得以墊片補償：墊片在沖壓振動下會鬆動，偏移很快再發生。定位面有磨耗或壓痕時，交模具技師修復定位面或更換定位塊，修復後單邊間隙回到 0.03 mm（模擬值）以內
      - path: repair.3.caution
        value: 不得自行加墊片，也不得以敲擊方式強迫對位
  SOP-STP-023:
    replace:
      - ["須確認平衡缸氣源 V1 已洩壓並以安全塊支撐滑塊，避免調整閉模高度時滑塊下滑", "須先於上下模之間放入安全塊，再關閉平衡缸氣源 V1 並洩壓，避免滑塊下滑；滑塊調整時要先撤出安全塊（依測試／定位程序）"]
      - ["若沖壓力峰值單次超過 225 t（模擬值）且過負荷保護動作", "若沖壓力峰值單次超過過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值）且過負荷保護動作"]
    set:
      - path: inspect.0.action
        value: 查閱換模紀錄與模具資料卡，以停機前 MES 已記錄的 shut_height_mm 比對模具主檔設定值並記錄差值（不需對機台送電）
      - path: inspect.0.requires_energized
        value: false
      - path: inspect.0.caution
        value: 只讀紀錄；必須現場讀 HMI 時依測試／定位程序，只讀值、不得移動滑塊
      - path: inspect.1.action
        value: 滑塊停止並上鎖後，在調整機構外側讀取閉模高度機械指示（刻度盤或指示器），核對刻度、鎖固狀態與兩側對稱性；不需伸手進入模區
      - path: inspect.1.caution
        value: 讀刻度時身體不得進入滑塊下方；平衡缸要等安全塊放妥後才洩壓
      - path: inspect.2.action
        value: 調閱 MES 已記錄的沖壓力監控歷史，檢視換模後首件前後之峰值與左右平衡值（不需送電）
      - path: inspect.2.requires_energized
        value: false
      - path: inspect.2.criteria
        value: 峰值異常高或低且左右平衡 ≤ 5%（模擬值）→ 支持本模式；若單次峰值超過過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值）且前後沖次正常 → 改懷疑 overload_tonnage（SOP-STP-053）；若左右差 > 10%（模擬值）→ 改懷疑 die_misalignment（SOP-STP-021）
      - path: inspect.3.caution
        value: 量測停機前已生產的首件即可，不要為了取件把手伸入模區
      - path: repair.0.action
        value: 依模具資料卡重新設定閉模高度：清點工具、撤出安全塊並確認模區無人後，依測試／定位程序由原上鎖人暫時解除、主管在場，以滑塊調整裝置寸動微調至模具主檔值（設施規則第70條），完成後鎖固調整機構、重新上鎖並放回安全塊
      - path: repair.0.requires_energized
        value: true
      - path: repair.0.caution
        value: 滑塊調整前安全塊必須先撤出，否則滑塊會壓到安全塊；調整期間手不得伸入模區；不得以墊片任意補償高度；鎖固後須確認刻度未跑位
      - path: verify.1.action
        value: 以寸動走一次空行程（無料），確認滑塊到下死點時模具閉合無干涉、無異音
      - path: verify.1.criteria
        value: 無干涉、無異音；沖壓力峰值與左右平衡留到下一步有料試沖時確認（無料空打讀不到沖壓力）
      - path: verify.2.criteria
        value: 尺寸落在圖面公差 ±0.05 mm（模擬值）內，毛邊高度 ≤ 0.08 mm（模擬值），無單側毛邊或導正孔壓痕；沖壓力峰值落在模具資料設定值 ±5%（模擬值）內、左右平衡 ≤ 5%（模擬值）
  SOP-STP-031:
    replace:
      - ["調整後以手動盤車確認無干涉", "調整後依測試／定位程序以寸動確認無干涉"]
      - ["以 SPM 60 以下（模擬值）低速試沖", "以生產速度一半以下（模擬值）低速試沖"]
      - ["或沖孔間隙超過板厚 12%（模擬值）", "或沖孔單邊間隙超過料厚 10%（模擬值）"]
      - ['"防跳屑銷或廢料擋銷"', '"頂料銷或防跳屑下模入子"']
    set:
      - path: repair.2.action
        value: 在沖頭加裝頂料銷（凸出沖頭端面約 0.5～1.0 mm，模擬值），或改用防跳屑下模入子；同時確認脫料板行程與彈簧回彈正常
      - path: repair.2.requires_energized
        value: false
      - path: repair.2.caution
        value: 頂料銷不得干涉沖頭行程；裝好後依測試／定位程序以寸動確認無干涉
  SOP-STP-033:
    replace:
      - ["近 10,080 分鐘（約一週，模擬值）", "近一週（模擬值）"]
      - ["刃口圓角半徑超過 0.05 mm（模擬值）", "刃口圓角半徑超過 0.10 mm（模擬值）"]
      - ["毛邊高度在 0.05 mm 以下（模擬值）", "毛邊高度在 0.08 mm 以下（模擬值）"]
    set:
      - path: inspect.1.caution
        value: 量測停機前已生產的製品即可，不需伸手進入模具空間
      - path: inspect.4.action
        value: 由原上鎖人暫時解除、主管在場，以寸動試沖一次（有料），讀取左右沖壓力平衡值 tonnage_balance_pct（無料空打讀不到沖壓力）
      - path: repair.1.caution
        value: 單次進刀量不得超過 0.02 mm（模擬值）；每次研磨量以磨到刃口銳利為止（一般約 0.1～0.2 mm，模擬值），並加墊片補回沖頭入模深度；累計研磨量接近可研磨量上限時更換沖頭；研磨時充分冷卻，避免刃口退火軟化
      - path: repair.2.caution
        value: 鎖緊扭力依模具圖面（例如 M8 內六角螺栓約 30 N·m，模擬值），不得為求牢靠而過度鎖緊，以免模仁變形或螺栓伸長
      - path: repair.3.action
        value: 【現場經驗（模擬）】更新模具履歷卡，登錄本次研磨量、累計研磨量與更換零件，並將 stroke_count_since_regrind 歸零
  SOP-STP-035:
    replace:
      - ["並確認滑塊停於上死點、放入安全塊後才可伸手進入模具", "並確認滑塊停止後已於上下模之間放入安全塊，才可伸手進入模具"]
      - ["手伸入模具前須確認滑塊已停於上死點並放入安全塊", "手伸入模具前須確認已於上下模之間放入安全塊"]
      - ["拉痕沿材料流動方向分布於成形圓角、伴隨黏模或料屑附著", "拉痕沿材料流動方向分布於成形圓角、伴隨黏模或料屑（鍍鋅料常見鋅屑）附著"]
    set:
      - path: inspect.0.criteria
        value: 液位低於下限刻度、油品變黑或有金屬屑沉澱、濾網堵塞 → 判定為本模式；液位、油品與濾網都正常 → 繼續下一步檢查油路與噴嘴，不要因此排除本模式；若製品表面其實沒有拉痕、異常是軸承溫升或滑塊異音 → 屬 central_lube_fault（SOP-STP-057）
      - path: inspect.4.action
        value: 沖床主電源保持上鎖，由原上鎖人只暫時解除模具噴油器的電源與氣源，以噴油器控制器的手動噴油測試觀察噴嘴霧化，並讀取 die_lube_pulse_per_min 與警報紀錄
      - path: inspect.4.caution
        value: 滑塊不動作；觀察時身體不得進入模具空間，用鏡子或手電筒從模外觀察
      - path: repair.2.caution
        value: 由模具技師執行；不可過度研磨造成模具間隙變大或成形尺寸超差；拋光後須量測成形面尺寸並記錄
      - path: verify.0.action
        value: 沖床主電源保持上鎖，以噴油器手動噴油測試確認各噴油嘴霧化狀況與噴油脈衝次數
      - path: verify.1.action
        value: 以單動（一行程一停止）低速試沖料帶 30 件（模擬值），逐件檢查成形面外觀與毛邊高度
      - path: verify.1.criteria
        value: 成形面無拉痕、無黏模、無料屑附著，毛邊高度不超過 0.08 mm（模擬值），成形尺寸在公差內
  SOP-STP-036:
    replace:
      - ["以寸動將滑塊點動至上死點", "以寸動將滑塊移至上死點"]
  SOP-STP-041:
    replace:
      - ["以寸動進行單張料帶試沖", "以寸動進行料帶試沖"]
    set:
      - path: inspect.3.action
        value: 滑塊停止並於上下模之間放入安全塊後才打開防護門，以工具輔助檢查模面、製品與廢料排出通道有無廢料上跳或凹痕
      - path: inspect.3.caution
        value: 手不得伸入滑塊下方，須以工具輔助
  SOP-STP-053:
    replace:
      - ["調整滾輪時不可用於直接轉動滾輪", "調整滾輪時不可用手直接轉動滾輪"]
      - ['"手動盤車工具"', '"噸位監控匯出紀錄"']
      - ["厚度實測與標示差 >0.02 mm（模擬值）", "厚度實測與標示差 >0.05 mm（模擬值）"]
      - ["步距誤差在 ±0.2 mm（模擬值）內", "步距誤差在 ±0.10 mm（模擬值）內"]
      - ["單片料寸動峰值仍 >225 t（模擬值）", "寸動試沖峰值仍超過過負荷設定值（模擬值）"]
      - ["以單片料寸動試沖", "以料帶寸動試沖"]
    set:
      - path: isolate_caution
        value: 本模式滑塊常停在下死點附近：先確認滑塊位置，滑塊卡在下死點無法退回時保持上鎖、不放安全塊也不進模區，通知設備工程師；過負荷保護油壓缸的洩壓與復歸由設備工程師確認（卡模狀態下洩壓會釋放模具內的能量）；滑塊可退回時才於上下模之間放入安全塊；沖床與送料機須同時上鎖
      - path: inspect.0.criteria
        value: 若單一沖次峰值超過過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值），且前後 5 個沖次（模擬值）維持在平常水準 → 判定為本模式；若換料捲後 30 分鐘內（模擬值）峰值出現一次 5% 以上（模擬值）階躍並維持新水準 → 改懷疑 material_thickness_dev（SOP-STP-007）；若峰值隨廢料輸送帶電流升高或堵塞出現 → 改懷疑 scrap_chute_jam（SOP-STP-065）
      - path: inspect.1.action
        value: 先確認滑塊位置：若滑塊停在下死點附近、無法以寸動退回，保持上鎖並依 escalate_if 通知設備工程師，不得自行處理；滑塊已退回且於上下模之間放入安全塊後，打開模具防護門，以手電筒檢查模內有無雙料、料頭重疊、異物、壓痕，並檢查脫料板、導正銷、沖頭與模仁
      - path: verify.0.caution
        value: 過負荷保護裝置的復歸（油壓過負荷重新建壓）由設備工程師確認後執行；原因未確認或保護未復歸前不得試沖
      - path: verify.1.criteria
        value: 峰值低於過負荷設定值的 90%（250 t 機台約 200 t、200 t 機台約 160 t，模擬值），三次差異 ≤5%（模擬值），無 OVERLOAD 或 DOUBLE_BLANK 警報
  SOP-STP-055:
    replace:
      - ["設定值偏離 5.0 bar（模擬值）", "設定值偏離 5.5 bar（模擬值）"]
      - ["將調壓閥調整至 5.0 bar（模擬值）", "將調壓閥調整至 5.5 bar（模擬值）"]
      - ["勿超過 5.5 bar（模擬值）", "勿超過 6.0 bar（模擬值）"]
    set:
      - path: inspect.0.action
        value: 調閱停機前 MES 已記錄的 air_pressure_bar 與 AIR_LOW 警報時間，並比對同一條供氣管路其他機台（不需對本機送電）
      - path: inspect.0.requires_energized
        value: false
      - path: inspect.0.caution
        value: 只讀紀錄；LOTO 洩壓後本機氣壓表會歸零，判讀要用洩壓前的紀錄
      - path: inspect.3.action
        value: 調閱 MES 已記錄的 counterbalance_bar 與主馬達電流，並比對模具資料的上模重量對應值（不需送電）
      - path: inspect.3.requires_energized
        value: false
      - path: repair.3.caution
        value: 壓力開關屬「氣壓低於設定時自動停止」的安全裝置（機械設備器具安全標準第40條）：不得調低設定值或使其失去作用；這一步只做動作確認與清潔，設定或更換由合格人員執行並記錄
      - path: repair.3.ref
        value: [S3, REG-N0060034-40]
      - path: verify.1.action
        value: 以寸動確認離合器結合、滑塊動作正常，並聽有無漏氣聲
      - path: verify.1.criteria
        value: 寸動 3 次（模擬值）動作正常、無 AIR_LOW、無漏氣聲；停止角度留到下一步單動試沖時讀取
      - path: verify.2.criteria
        value: 氣壓維持 4.8 bar（模擬值）以上，同管路其他機台無同時壓降，AIR_LOW 未再出現，停止角度監視器讀值在設定上限內；停止角度仍超限 → 改走 SOP-STP-051（離合器／制動器屬安全裝置，交合格人員）；壓降重現 → 通知設備工程師／原廠技師
  SOP-STP-056:
    replace:
      - ["5.5～6.5 bar（模擬值）", "5.5～6.0 bar（模擬值）"]
      - ["停止時間超過 0.35 s（模擬值）", "停止時間超過 230 ms（模擬值）"]
    set:
      - path: isolate_caution
        value: 平衡缸屬氣壓儲能：須先於上下模之間放入安全塊，再關閉氣源閥 V1 並將缸內殘壓洩至 0 bar（模擬值），人員才可進入滑塊作業區
      - path: inspect.0.action
        value: 查閱模具資料表，取得本次上模重量對應的平衡缸壓力設定值，與停機前 MES 已記錄的 counterbalance_bar（洩壓前讀值）比對；同時確認氣源總壓紀錄
      - path: inspect.0.caution
        value: LOTO 洩壓後錶頭會歸零，比對要用洩壓前的紀錄；不得在帶壓狀態下拆裝錶頭
      - path: inspect.1.action
        value: 調閱換模後 240 分鐘（模擬值）內 MES 已記錄的平衡缸壓力、主馬達電流與氣源總壓，比對三項訊號的變化時序（不需送電）
      - path: inspect.1.requires_energized
        value: false
      - path: inspect.2.action
        value: 調閱停止角度監視器近數日的停止角度與停止時間紀錄（不需送電）
      - path: inspect.2.requires_energized
        value: false
      - path: inspect.2.caution
        value: 離合器／制動器屬安全裝置，本 SOP 只讀紀錄、不調整
      - path: inspect.3.action
        value: 量測停機前已生產製品的成形高度與壓印深度，並調閱沖壓力峰值與左右平衡紀錄（不需再試沖）
      - path: inspect.3.requires_energized
        value: false
      - path: inspect.3.caution
        value: 不要為了取件把手伸入模區
      - path: repair.0.requires_energized
        value: true
      - path: repair.0.caution
        value: 安全塊保持在上下模之間；調壓只在平衡缸調壓閥處操作，任何人不得位於滑塊下方或模區
      - path: verify.0.criteria
        value: 無異音、滑塊無頓挫；主馬達電流比對留到試沖時確認（寸動時的電流不具代表性）
      - path: verify.2.criteria
        value: 成形高度與壓印深度在 ±0.05 mm（模擬值）內、首末件差異在 0.03 mm（模擬值）內、停止角度未超限且無異音；主馬達電流在上行段與下行段較換模前基準差異在 5%（模擬值）以內，方可結案
  SOP-STP-057:
    replace:
      - ["以寸動起動集中潤滑泵", "由原上鎖人依測試程序暫時解除後，手動起動集中潤滑泵"]
    set:
      - path: inspect.3.action
        value: 【現場經驗（模擬）】檢查成形件表面、模仁、脫料板有無拉痕、黏模或料屑附著，並查看模具噴油器噴油次數與模具潤滑油箱液位；機台集中潤滑異常通常不會先反映在製品表面
      - path: verify.1.action
        value: 以寸動試沖 3 次（模擬值）後停機，檢查製品與模具表面有無拉痕、黏模、料屑；確認模具潤滑噴油次數正常
      - path: verify.1.criteria
        value: 製品表面無拉痕、黏模、料屑，且集中潤滑壓力維持 1.0 bar（模擬值）以上 → 通過；若出現拉痕、黏模或料屑 → 改懷疑 die_lubrication_insufficient，改走 SOP-STP-035
      - path: verify.1.ref
        value: [L3]
      - path: verify.2.action
        value: 恢復生產後 2 小時（模擬值）內追蹤 bearing_temp_c 趨勢與集中潤滑壓力，並以聽診棒確認滑塊異音（寸動幾個行程看不出溫升）
      - path: verify.2.criteria
        value: 軸承溫度不再爬升並穩定在 60 °C 以下（模擬值），集中潤滑壓力維持 1.0 bar（模擬值）以上，無異常異音 → 完成；溫度仍上升或異音加劇 → 通知設備工程師／原廠技師
      - path: verify.2.ref
        value: [L13]
  SOP-STP-061:
    replace:
      - ["低於 30 VDC（模擬值）", "低於 50 V（模擬值）"]
    set:
      - path: inspect.0.action
        value: 在斷電上鎖狀態下，目視檢查送料滾輪、聯軸器、軸承與傳動鏈有無卡死、異物、鬆動或異常間隙；以扳手轉動滾輪軸端確認轉動平順（不可徒手轉動滾輪面）
      - path: inspect.0.criteria
        value: 轉動應平順，無卡死、異音或明顯間隙；聯軸器間隙不得超過 0.05 mm（模擬值）。若卡死或異音，先排除機械卡滯再查驅動器
      - path: inspect.0.caution
        value: 轉動前確認料捲與料帶張力已釋放、滾輪抬升氣缸已洩壓且上滾輪已用墊塊撐開，手指不得進入滾輪咬合點
      - path: inspect.1.action
        value: 調閱停機前 MES 已記錄的驅動器警報、motor_current_a、motor_temp_c 與 feed_length_error_mm（停機前 10 分鐘，模擬值），比對警報發生時序（不需對送料機送電）
      - path: inspect.1.requires_energized
        value: false
      - path: inspect.1.caution
        value: 只讀紀錄；驅動器內部警報履歷若必須送電讀取，依測試／定位程序由電氣合格人員執行
      - path: inspect.4.action
        value: 停機上鎖後立即以紅外線測溫槍量測馬達外殼溫度；斷電下檢查驅動器散熱風扇與濾網是否積塵、扇葉是否破損，用手撥動風扇確認轉動順暢
      - path: inspect.4.requires_energized
        value: false
      - path: inspect.4.criteria
        value: 馬達外殼溫度 >75 °C（模擬值）、風扇卡滯或濾網堵塞 → 支持驅動器／馬達過載；溫度在 45～65 °C（模擬值）且散熱正常 → 偏向間歇性感測或參數問題；三相電流平衡留到驗證送料時由電氣合格人員以鉤表量測
      - path: inspect.4.caution
        value: 不得在通電下拆開驅動器蓋板；撥動風扇前確認母線已放電
      - path: verify.1.criteria
        value: 送料長度誤差在 ±0.05 mm（模擬值）內；馬達外殼溫度不超過 70 °C（模擬值）；由電氣合格人員以鉤表量測三相電流，不平衡不超過 10%（模擬值）
  SOP-STP-063:
    replace:
      - ['"張力計"', '"捲尺（料環深度量測用）"']
      - ["若料帶離平台間隙超過 1.5 mm（模擬值）", "若每 1 m 料帶離平台間隙超過 1.5 mm（模擬值）"]
      - ["實際壓下量與設定表差超過 0.05 mm（模擬值）", "實際壓下量與設定表差超過 0.1 mm（模擬值）"]
      - ["1.0 mm/m（模擬值）", "1.5 mm/m（模擬值）"]         # 與 SOP-STP-009 的側彎判定值一致
  SOP-STP-065:
    replace:
      - ["確認滑塊已停在上死點並有機械支撐", "確認已於上下模之間放入安全塊"]
      - ["確認滑塊已在上死點並有機械支撐", "確認已於上下模之間放入安全塊"]
      - ["以寸動方式點動廢料輸送帶", "以寸動方式短暫運轉廢料輸送帶"]
      - ["明顯升高超過 1.8 A（模擬值）", "明顯升高超過 2.0 A（模擬值）"]   # 與 signals.yaml scrap_conveyor_current_a 一致
      - ["輸送帶電流穩定在 1.2 A 以下（模擬值）", "輸送帶電流穩定在 1.0～1.4 A（模擬值）"]
      - ["若電流超過 1.8 A（模擬值）", "若電流超過 2.0 A（模擬值）"]
      - ["輸送帶電流持續超過 1.8 A（模擬值）", "輸送帶電流持續超過 2.0 A（模擬值）"]
      - ["沖壓力峰值低於 225 t（模擬值）", "沖壓力峰值低於過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值）"]
      - ["若沖壓力峰值單次超過 225 t（模擬值）", "若沖壓力峰值單次超過過負荷設定值（模擬值）"]
    set:
      - path: inspect.2.action
        value: 調閱 MES 已記錄的沖壓力峰值與模具保護紀錄（不需送電），確認異常是單次尖峰還是與廢料回堆同時出現
      - path: inspect.2.requires_energized
        value: false
      - path: inspect.2.criteria
        value: 沖壓力峰值未超過過負荷設定值（250 t 機台 225 t、200 t 機台 180 t，模擬值），且異常前後沖次平穩，但落料孔有廢料回堆 → 判定為本模式；若單次峰值超過過負荷設定值並伴隨雙料、料頭重疊或模內異物 → 改懷疑 overload_tonnage（SOP-STP-053）
