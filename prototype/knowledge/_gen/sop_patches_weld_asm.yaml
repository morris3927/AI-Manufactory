# 銲接線／組裝線 SOP 審稿修正（gen_sops_wa.py assemble 時套用，確保可重現）
# 審稿者：ai_sim_reviewer_weld_asm（AI 角色扮演「資深銲接／組裝主管」，非真人專家審核）。紀錄見 reviews/2026-10-21_weld_asm.md
global_replace:
  - ["手動釋放煞車", "手動鬆開各軸煞車"]
  - ["手動釋放機器人煞車", "手動鬆開機器人各軸煞車"]
per_sop:
  SOP-WLD-012:
    escalate_if:
      - 更換導電嘴後，每百次起弧重試次數仍超過 8 次（模擬值）或 ARC_START_FAIL 持續發生 → 依序改查 SOP-WLD-011（送絲不順）與 SOP-WLD-015（接地不良），並通知設備工程師檢查銲接電源起弧參數
      - 送絲實際速度比設定值低 10% 以上（模擬值）或送絲馬達電流超過 4.5 A（模擬值），且送絲機內有銲絲纏繞成團 → 改走 SOP-WLD-011（送絲不順／鳥巢）
      - 銲槍頸管或導電嘴座有回燒變色、撞擊變形，或銲道位置整批偏移 → 改走 SOP-WLD-021（銲槍 TCP 偏移），由機器人工程師確認 TCP
  SOP-WLD-013:
    replace:
      - ['"W6", "L1"]', '"W6", "L1", "REG-N0060009-106"]']
  SOP-WLD-014:
    replace:
      - ['"W1", "PUB-OSHA-FS-3647-reducing-exposure"]', '"W6"]']
      - ['["none"]', '["REG-N0060025-28"]']
  SOP-WLD-015:
    escalate_if:
      - 清潔與緊固後，有問題側接地回路電阻仍超過 0.1 Ω（模擬值），或試銲後接頭再次發熱變色 → 更換回路電纜總成，並通知設備工程師檢查銲接電源接地端子
      - 接地修復後 arc_voltage_cv_pct 仍超過 10%（模擬值），且送絲速度、送絲馬達電流與導電嘴都正常 → 通知設備工程師檢查銲接電源輸出
      - 送絲馬達電流超過 4.5 A（模擬值）、送絲速度低於設定 10% 以上（模擬值）或送絲導管有卡阻 → 改走 SOP-WLD-011（送絲不順／鳥巢）
  SOP-WLD-021:
    replace:
      - ['"L20", "REG-N0060025-28"]', '"L20", "REG-N0060025-27"]']
  SOP-WLD-041:
    replace:
      - ["讀取前須確認中頻控制器直流母線電容（S2）已放電完成並驗電，不得觸碰帶電端子", "讀取紀錄時只操作控制器顯示畫面，不得打開控制器機殼或觸碰端子"]
      - ["不得調整或關閉任何鎖附計數、防錯或扭力判定功能來讓 NOK 變 OK", "不得關閉電極管理計數或點銲電流監視功能"]
      - ["ARC_START_FAIL 等通用警報重複發生", "SPOT_CURRENT_DEV 警報重複發生"]
  SOP-WLD-042:
    replace:
      - ["點銲熔核直徑 ≥4.0 mm（模擬值）", "點銲熔核直徑 ≥4.5 mm（模擬值）"]
  SOP-ASM-011:
    replace:
      - ["依正確下壓力與垂直姿態補鎖 NOK 孔位（僅限孔牙正常且已排除斜牙／滑牙者），補鎖後標記並保留紀錄", "拆下 NOK 螺絲、換新螺絲後依正確下壓力與垂直姿態重新鎖附（僅限孔牙正常且已排除斜牙／滑牙者；不在原螺絲上直接補鎖），完成後標記並保留紀錄"]
  SOP-ASM-012:
    replace:
      - ["讀取紀錄前先確認控制器電源已隔離；", "紀錄於上鎖前匯出或截取；"]
  SOP-ASM-041:
    replace:
      - ["絕緣電阻 ≥ 10 MΩ（模擬值），HIPOT 通過。若仍", "絕緣電阻 ≥ 100 MΩ（模擬值），HIPOT 通過。若仍"]
review:
  status: approved
  reviewed_by: [ai_sim_reviewer_weld_asm]
  note: "AI 角色扮演審核，非真人專家審核（2026-10-21，見 reviews/2026-10-21_weld_asm.md）"
