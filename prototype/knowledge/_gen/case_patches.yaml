      technician_report_normalized: PR01 影像系統判定模具噴油嘴無油霧並發出模具潤滑警報。現場檢查模具潤滑油箱液位在正常刻度、油品無異常，HMI 噴油脈衝維持每分鐘約 6 次；沿油路查看油管無折扁、接頭無滲油，上鎖後近看噴油嘴確認有油霧。比對攝影畫面，發現補光燈角度被碰歪，油霧在畫面中看不出來，造成影像誤判。調回補光燈角度後影像恢復正常，警報復歸並恢復生產，停機約十五分鐘。
      why_first_guess_wrong: 影像判定噴油嘴沒有油霧，直覺懷疑模具潤滑不足；但油箱液位、噴油脈衝與噴嘴霧化都正常，真正原因是補光燈角度改變讓影像看不到油霧，並非潤滑問題。
      lessons: 影像說噴嘴沒霧，先看液位和脈衝，再上鎖近看噴嘴；畫面看不到不等於真的沒噴，補光燈角度也要檢查。
