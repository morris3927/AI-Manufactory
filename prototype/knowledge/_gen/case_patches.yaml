    note: 原推論靠一筆 0.01 mm 讀值說「誤差忽大忽小所以不是滾輪」，很牽強；刪除該讀值，改用真正的區分：MISFEED 從 03:42 就反覆跳、前三次誤差都正常，斜坡只出現在最後。
    drop_signals:
    - 06:40:49 feed_length_error_mm
    set:
      why_first_guess_wrong: 06:28 起送料誤差由 0.02 爬到 0.21 mm，加上滾輪表面有亮帶與油污，直覺就是滾輪磨損打滑；但 MISFEED 從 03:42 就開始反覆跳、每次重置即恢復，前三次跳脫時誤差都正常，滾輪磨損只能解釋最後一次，反覆停機的主因是感測器接頭鬆動。
