# 案例人工審核修正（2026-10-21 AI 角色扮演：模擬設備保全工程師；非真人專家審核）
# 由 gen_cases.py assemble 每次重新套用在 _gen/raw/cases/ 的 LLM 草稿上（草稿本身不改）。
# 欄位：note（審核理由，不寫入案例）、replace [[舊, 新]]（所有文字欄位做字串取代，沒命中會在 CHECK 報 patch not matched）、
#       set（直接覆寫文字欄位）、actions（覆寫 LLM 的處置步驟，不含上鎖步驟）、loto_at（上鎖步驟插入位置，預設 0）、
#       force_loto（手進入危險區 → 強制 loto_done / danger_zone_entry = true）、drop_signals（"HH:MM:SS signal"）、
#       recent_changes（覆寫 context.recent_changes）。
# 通用規則（不需逐筆寫）在 gen_cases.py：跨機台連動上鎖文字、通電前測試／定位步驟、試沖前恢復確認步驟。
