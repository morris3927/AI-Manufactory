      - 03:42、05:16、05:42 三次跳脫時送料誤差正常，誤差斜坡要到 06:28 之後才出現
    - - 調閱停機前送料長度誤差紀錄，數值忽大忽小、並非隨時間逐步累積
      - 調閱各次跳脫前的送料長度誤差紀錄
    - - 排除滾輪磨損為主因
      - 前三次誤差正常，06:28 後才斜坡上升，滾輪磨損僅為次因
  CASE-STP-0064:
    note: MES 的 MISFEED 來自誤送料感測器，不可能由攝影機反光觸發；且 log 只有一次 MISFEED，原文卻寫「一直跳」。改為操作員穿料頭暫停送料、感測器依設計動作（generator 已加 FA_STORY_OVERRIDE）。heldout 案例。
    set:
      technician_report_raw: FD02 MISFEED停一次 停機前誤差0.01 感測接頭沒鬆 感應面ok 問操作員 穿新料頭暫停送料 正常保護 重置ok
      technician_report_normalized: FD02 於 08:25 發生一次 MISFEED 停機，停機前送料長度誤差僅 0.01 mm。依第一判斷上鎖檢查誤送料感測器，接頭無鬆動、端子無氧化、感應面無油屑，訊號正常，排除感測器故障。向操作員確認，當時正在穿新料頭並暫停送料，感測器偵測不到料帶而依設計動作，屬正常保護。重置後 08:26 恢復運轉，觀察至結案未再觸發，無零件更換。
      why_first_guess_wrong: 誤送料停機、停機前誤差只有 0.01 mm，看起來像感測器誤報；但本班只觸發一次（感測器誤報通常一班內反覆觸發），接頭與感應面都正常，實際是操作員穿料頭暫停送料時感測器依設計動作，不是故障。
      discriminating_evidence:
      - 停機前 feed_length_error_mm 僅 0.01 mm，料帶實際位置正常
      - 本班 MISFEED 只觸發一次，不符合感測器誤報「一班內反覆觸發」的特徵
      - 感測器接頭無鬆動、端子無氧化、感應面無油屑
      - 操作員確認當時正在穿新料頭並暫停送料，時間與停機吻合
      lessons: MISFEED 只跳一次先問操作員當下在做什麼；穿料、換捲暫停送料會讓感測器正常動作，不必每次都拆接頭。
    actions:
    - step: 調閱 MISFEED 警報紀錄與停機前送料長度誤差
      result: 誤差 0.01 mm，本班只觸發一次
    - step: 檢查誤送料感測器接頭、端子與感應面
      result: 無鬆動、無油屑，排除感測器故障
    - step: 向操作員確認停機當下作業
      result: 穿新料頭暫停送料，感測器依設計動作
    - step: 重置並恢復運轉，觀察至結案
      result: 未再跳 MISFEED
