# Sentinel AI 後端設定
# 所有門檻集中在這裡，不寫死在程式裡（08_系統設計.md §10）。路徑以 prototype/ 為基準。

app:
  timezone: Asia/Taipei
  sim_start: "2026-10-30T09:00:00+08:00"   # 測試與逐步模擬用的起始時間（日班）
  ambient: true                             # 沒有劇本時，背景持續產生正常 Log 與畫面

paths:
  plant: data/simulated/plant.yaml
  roster: data/simulated/roster.csv
  access: data/simulated/access.csv
  scenarios: data/simulated/scenarios
  knowledge: knowledge
  drafts: knowledge/cases/_drafts           # 結案回寫的案例草稿（review_status=draft）
  videos_root: .                            # 劇本裡的影片路徑相對於這裡
  models: models
  db: backend/sentinel.db
  chroma: backend/chroma
  keyframes: backend/keyframes              # 異常成立時的關鍵幀（人員畫面已模糊臉部）

jev:
  url: https://openrouter.ai/api/alpha/decisions
  model: typesafe/jev-1.14                  # 鎖定版本，門檻是對這個版本調的
  timeout_s: 3.0
  enabled: true
  warmup: true

llm:
  url: https://ollama.com/api/chat
  model: deepseek-v4.1-flash
  timeout_s: 30.0
  enabled: true

kb:
  embedding: auto                           # auto：有裝 sentence-transformers 用 embedding_model，否則 hash（只給測試）
  embedding_model: BAAI/bge-m3              # eval R1（retrieval_eval）：hit@1 1.00、MRR 1.00，查詢 P95 約 120 ms（M3 CPU）
  index_text: structured                    # 案例向量＝結構化事實（與事件查詢同寫法）＋摘要；summary＝舊版
  retrieval:                                # kb.retrieve.RetrievalCfg；混合檢索（向量＋BM25，RRF）＋metadata 加減分
    mode: hybrid                            #   legacy＝舊版（Chroma top-20＋同機台／同事件硬排序，只供對照）
    boost_trigger: 1.0                      #   同觸發事件類型
    boost_machine_type: 0.5                 #   同機型加分（不再硬篩：同根因常出現在其他機型）
    boost_signals: 1.0                      #   訊號名稱 Jaccard
    penalty_non_root_cause: 1.0             #   最終根因 none／new 的案例減分（事件像誤報時不減）
  allow_draft: false

vision:
  fps: 15
  ppe_fps: 5
  keyframe_interval_s: 2                    # eval E6：MISFEED → 開單由 0.55 s 降到 0.02 s，看圖次數約 2.3 倍
  jpeg_quality: 85
  jev_max_side: 768
  yolo_weights: models/ppe.pt
  yolo_device: mps
  yolo_classes: {head: [head, Head, no_helmet, NO-Hardhat], helmet: [helmet, Helmet, Hardhat], person: [person, Person]}
  ppe_jev_confirm: false                    # V1（M2）

thresholds:
  p_jam: 0.7
  p_jam_count: 2
  p_jam_window_s: 15
  feed_drop_window_s: 30
  jev_stale_s: 30                           # 這段時間內沒有 Jev 看圖結果 → 規則改用動態分數退路
  p_smoke_outside: 0.7                      # 銲接：Jev 判定工位外有煙霧
  p_flame: 0.7
  smoke_window_s: 10
  screw_nok_rate_pct: 3.0                   # 組裝：近 100 次 NOK 率（signals.yaml alarm > 3）
  screw_nok_s: 3                            # 鎖附結果連續 NOK 秒數
  ppe_overlap: 0.3                          # Head 與 Helmet 重疊比例低於此值 → 未戴安全帽
  ppe_conf: 0.5
  ppe_dedupe_s: 3
  ppe_window_s: 5
  log_mismatch_s: 20
  multi_stop_window_s: 15                   # 不同連動群組的機台在這段時間內都停止 → S3（需同時有氣源壓力低）
  air_pressure_low_bar: 4.8                 # signals.yaml air_pressure_bar alarm
  person_zone_window_s: 5                        # 影像閒置 ↔ Log 運轉 持續秒數
  p_false_alarm: 0.9
  root_cause_conf: 0.8                      # Jev 根因 top-1 機率 ≥ 此值 → jev_top3；否則加跑 LLM 深入診斷（eval E3：0.6–0.8 過度自信）
  safety_gate_p: 0.3                        # 舊版單一門檻（僅保留相容）
  gate:                                     # J4 各題門檻：2026-10-21 以 eval/gate_set.yaml（32 步）實測 Jev 校準
    needs_loto: 0.3                         #   LOTO_DONE 前才會用到；之後只記錄
    enters_danger_zone: 0.55                #   結果 recall 1.00、precision 1.00（全部 0.3 時 precision 0.90）
    high_voltage: 0.45                      #   重跑：python -m sentinel.eval.calibrate_gate
    energized: 0.55
  writeback_complete: 0.7
  sop_top1: 0.6
  sop_low: 0.3
  incident_update_s: 5                      # 同一 Incident 更新事件的最短發布間隔

escalation:
  ack_timeout_s: {S1: 600, S2: 300, S3: 120}
  demo_ack_timeout_s: null                  # Demo 可設 30，覆蓋上面的值

workflow:
  require_permit: true                      # 設備類：ACKED → 申請許可 → 班長核准 → LOTO → 維修（設施規則第57條）
  scripted_casualty: false        # Demo：傷亡由主管在畫面上標記（測試另行開啟）

mes:
  tick_s: 1.0
  seed: 42

discord:
  channels: {stamping: "", assembly: "", welding: "", emergency: ""}
